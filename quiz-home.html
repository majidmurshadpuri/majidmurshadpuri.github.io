<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quiz</title>

<link rel="stylesheet" href="quiz-engine.css">

<style>
  :root {
    --green: #123c35;
    --green2: #1d5b4e;
    --ink: #172b27;
    --muted: #66736e;
    --card-bg: #ffffff;
    --border-light: #e5e5d9;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: linear-gradient(145deg, #e9f0e9, #f8f4e9);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 44px;
  }

  .main-wrapper {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
  }

  .page-header {
    text-align: center;
    border-bottom: 2px solid var(--border-light);
    padding-bottom: 16px;
    position: relative;
  }
  .page-header h1 {
    font-size: clamp(24px, 5vw, 32px);
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  .student-info {
    font-size: 16px;
    color: var(--muted);
    font-weight: 500;
  }
  .student-info strong { color: var(--green); font-weight: 700; }

  .switch-student-btn {
    position: absolute;
    top: 0;
    right: 0;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 20px;
    background: transparent;
    border: 1px solid var(--muted);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .switch-student-btn:hover { background: var(--muted); color: #fff; }

  .form-overlay {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    width: 100%;
  }
  .student-form {
    background: var(--card-bg);
    border: 1px solid var(--border-light);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 15px 35px rgba(23, 43, 39, 0.08);
    text-align: center;
  }
  .student-form h2 {
    margin: 0 0 8px 0;
    font-size: 28px;
    color: var(--green);
  }
  .student-form p {
    color: var(--muted);
    margin: 0 0 28px 0;
    font-size: 15px;
  }
  .form-group { text-align: left; margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid #e6e9e1;
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
    transition: border 0.15s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--green2);
    box-shadow: 0 0 0 3px rgba(29, 91, 78, 0.12);
  }

  .btn {
    background: #fff;
    border: 2px solid #e6e9e1;
    color: var(--green);
    font-weight: 800;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
    box-shadow: 0 10px 18px -8px rgba(27, 78, 100, 0.44);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--green2);
    border-color: var(--green2);
    transform: scale(1.02);
  }
  .btn-full { width: 100%; }
  .btn-secondary {
    background: #f0f4ed;
    border-color: #d0d9d3;
    color: var(--green);
  }
  .btn-secondary:hover { background: #e2e9e4; }

  .hide { display: none !important; }

  .student-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
    text-align: left;
  }
  .student-list-item {
    background: #f8faf7;
    border: 1px solid var(--border-light);
    padding: 14px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.15s;
  }
  .student-list-item:hover {
    background: #edf2ee;
    border-color: var(--green2);
  }
  .student-list-item .class-tag {
    font-size: 13px;
    color: var(--muted);
    background: #fff;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border-light);
  }

  .level-host { width: 100%; }

  .next-level-wrapper {
    display: flex;
    justify-content: center;
    margin-top: 10px;
    padding-bottom: 20px;
  }

  .inline-msg {
    background: #fdf2f2;
    border: 1px solid #f5c2c7;
    color: #842029;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="main-wrapper">

  <div id="studentSelectionScreen" class="form-overlay hide">
    <div class="student-form">
      <h2>👥 Select Student</h2>
      <p>Choose your profile or add a new one.</p>
      <div id="studentListContainer" class="student-list"></div>
      <button class="btn btn-primary btn-full" id="showAddFormBtn" style="margin-bottom:12px;">
        ➕ Add New Student
      </button>
    </div>
  </div>

  <div id="addStudentFormOverlay" class="form-overlay hide">
    <div class="student-form">
      <h2>📋 New Student Details</h2>
      <p>Enter your name and class to begin the quiz.</p>
      <div id="formErrorMsg" class="inline-msg hide"></div>
      <div class="form-group">
        <label for="studentNameInput">Full name</label>
        <input type="text" id="studentNameInput" placeholder="e.g. Aarav Sharma" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="studentClassSelect">Class</label>
        <select id="studentClassSelect">
          <option value="" disabled selected>Select your class</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>
      <button class="btn btn-primary btn-full" id="saveNewStudentBtn">🚀 Save & Start Quiz</button>
      <button class="btn btn-secondary btn-full hide" id="cancelAddStudentBtn" style="margin-top:10px;">
        Cancel
      </button>
    </div>
  </div>

  <div id="quizArea" class="hide">
    <div class="page-header">
      <button class="switch-student-btn" id="switchStudentBtn">Switch Student</button>
      <h1>Math Quiz</h1>
      <div class="student-info" id="studentInfoText"></div>
    </div>

    <div id="levelHost" class="level-host"></div>

    <div class="next-level-wrapper hide" id="nextLevelWrapper">
      <button class="btn btn-primary" id="nextLevelBtn">🚀 Move to next level</button>
    </div>
  </div>
</div>

<script src="quiz-engine.js"></script>
<script>
(function () {
  'use strict';

  const STUDENTS_LIST_KEY   = 'math_quiz_students_list_v1';
  const ACTIVE_STUDENT_KEY  = 'math_quiz_active_student_id_v1';
  const PROGRESS_KEY_PREFIX = 'math_quiz_progress_v3_';

  const studentSelectionScreen = document.getElementById('studentSelectionScreen');
  const studentListContainer   = document.getElementById('studentListContainer');
  const showAddFormBtn         = document.getElementById('showAddFormBtn');
  const addStudentFormOverlay  = document.getElementById('addStudentFormOverlay');
  const formErrorMsg           = document.getElementById('formErrorMsg');
  const studentNameInput       = document.getElementById('studentNameInput');
  const studentClassSelect     = document.getElementById('studentClassSelect');
  const saveNewStudentBtn      = document.getElementById('saveNewStudentBtn');
  const cancelAddStudentBtn    = document.getElementById('cancelAddStudentBtn');
  const quizArea               = document.getElementById('quizArea');
  const studentInfoText        = document.getElementById('studentInfoText');
  const switchStudentBtn       = document.getElementById('switchStudentBtn');
  const levelHost              = document.getElementById('levelHost');
  const nextLevelWrapper       = document.getElementById('nextLevelWrapper');
  const nextLevelBtn           = document.getElementById('nextLevelBtn');

  let studentsList = [];
  let activeStudentId = null;
  let activeStudent = null;
  let progress = null;
  let levelsCache = null;
  let controller = null;

  function showFormError(msg) {
    if (!msg) {
      formErrorMsg.classList.add('hide');
      formErrorMsg.textContent = '';
    } else {
      formErrorMsg.textContent = msg;
      formErrorMsg.classList.remove('hide');
    }
  }

  function loadJSON(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function saveJSON(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
  }
  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2);
  }

  const EMBEDDED_LEVELS = {
    "levels": [
      {
        "id": 1,
        "title": "3‑Digit Multiplication · Digits 6–9",
        "operator": "×",
        "operandA": { "digits": 3, "allowedDigits": [6,7,8,9], "distinctDigits": true },
        "operandB": { "digits": 3, "allowedDigits": [6,7,8,9], "distinctDigits": true },
        "questionCount": 5,
        "uniqueness": "no-reused-numbers",
        "options": { "count": 4, "perturbChance": 0.3, "perturbRange": [-100,100], "fallbackRange": [-1000,1000] }
      }
    ]
  };

  async function loadAllLevels() {
    if (levelsCache) return levelsCache;

    try {
      const res = await fetch('quiz-levels.json', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        const list = Array.isArray(data) ? data : data.levels;
        if (Array.isArray(list) && list.length > 0) {
          levelsCache = list;
          return levelsCache;
        }
      }
    } catch (e) { /* fall through */ }

    levelsCache = EMBEDDED_LEVELS.levels;
    return levelsCache;
  }

  function findLevel(id) {
    return (levelsCache || []).find(l => l.id === id) || null;
  }
  function findNextLevel(id) {
    const list = levelsCache || [];
    return list.find(l => l.id > id) || null;
  }

  function getProgressKey() { return PROGRESS_KEY_PREFIX + activeStudentId; }

  function defaultProgress() {
    return { currentLevel: 1, completedLevels: {} };
  }

  function loadProgress() {
    const saved = loadJSON(getProgressKey());
    progress = saved && typeof saved === 'object'
      ? { ...defaultProgress(), ...saved }
      : defaultProgress();
    if (!progress.completedLevels) progress.completedLevels = {};
  }
  function saveProgress() { saveJSON(getProgressKey(), progress); }

  function hideAllScreens() {
    studentSelectionScreen.classList.add('hide');
    addStudentFormOverlay.classList.add('hide');
    quizArea.classList.add('hide');
    nextLevelWrapper.classList.add('hide');
  }

  function showStudentSelection() {
    hideAllScreens();
    studentSelectionScreen.classList.remove('hide');
    studentListContainer.innerHTML = '';
    if (studentsList.length === 0) {
      studentListContainer.innerHTML =
        '<p style="text-align:center;color:var(--muted);">No students found. Add a new one below!</p>';
    } else {
      studentsList.forEach(s => {
        const div = document.createElement('div');
        div.className = 'student-list-item';
        div.innerHTML =
          `<span>👤 ${s.name}</span><span class="class-tag">Class ${s.class}</span>`;
        div.addEventListener('click', () => {
          activeStudentId = s.id;
          saveJSON(ACTIVE_STUDENT_KEY, activeStudentId);
          loginStudent(s);
        });
        studentListContainer.appendChild(div);
      });
    }
    if (studentsList.length === 0) cancelAddStudentBtn.classList.add('hide');
  }

  function showAddStudentForm() {
    hideAllScreens();
    showFormError('');
    addStudentFormOverlay.classList.remove('hide');
    studentNameInput.value = '';
    studentClassSelect.value = '';
    if (studentsList.length > 0) cancelAddStudentBtn.classList.remove('hide');
    else cancelAddStudentBtn.classList.add('hide');
  }

  async function loginStudent(student) {
    activeStudent = student;

    try { await loadAllLevels(); }
    catch (e) {
      levelHost.innerHTML = '<div class="inline-msg">Could not load quiz-levels.json.</div>';
      return;
    }

    loadProgress();

    if (!progress.currentLevel || !findLevel(progress.currentLevel)) {
      progress.currentLevel = 1;
      saveProgress();
    }

    hideAllScreens();
    quizArea.classList.remove('hide');
    updateHeaderText();
    openLevel(progress.currentLevel);
  }

  function updateHeaderText() {
    if (!activeStudent || !progress) return;
    const lvl = progress.currentLevel || 1;
    const lvlCfg = findLevel(lvl);
    const lvlTitle = lvlCfg ? ` — ${lvlCfg.title}` : '';
    studentInfoText.innerHTML =
      `<strong>${activeStudent.name}</strong> (Class ${activeStudent.class}) — Level ${lvl}${lvlTitle}`;
  }

  function hideNextLevelButton() { nextLevelWrapper.classList.add('hide'); }
  function showNextLevelButton() { nextLevelWrapper.classList.remove('hide'); }

  function openLevel(levelId) {
    if (controller) { try { controller.destroy(); } catch (e) {} controller = null; }

    const levelCfg = findLevel(levelId);
    if (!levelCfg) {
      const all = levelsCache || [];
      if (all.length === 0) {
        levelHost.innerHTML = '<div class="inline-msg">No levels found.</div>';
        return;
      }
      const fallback = all[all.length - 1];
      progress.currentLevel = fallback.id;
      saveProgress();
      updateHeaderText();
      return openLevel(fallback.id);
    }

    progress.currentLevel = levelCfg.id;
    saveProgress();
    updateHeaderText();
    hideNextLevelButton();

    controller = QuizEngine.mount({
      levelConfig: levelCfg,
      hostEl: levelHost,
      studentData: activeStudent,
      onFinished: (score, total) => {
        if (score === total) {
          progress.completedLevels[levelId] = total;
          saveProgress();
          if (findNextLevel(levelId)) showNextLevelButton();
          else hideNextLevelButton();
        } else {
          if (progress.completedLevels[levelId] === total) {
            delete progress.completedLevels[levelId];
            saveProgress();
          }
          hideNextLevelButton();
        }
      }
    });
  }

  switchStudentBtn.addEventListener('click', showStudentSelection);
  showAddFormBtn.addEventListener('click', showAddStudentForm);
  cancelAddStudentBtn.addEventListener('click', showStudentSelection);

  saveNewStudentBtn.addEventListener('click', async () => {
    const name = studentNameInput.value.trim();
    const cls = studentClassSelect.value;
    if (!name) { showFormError("Please enter the student's name."); return; }
    if (!cls)  { showFormError('Please select the class.'); return; }
    showFormError('');

    const newStudent = { id: generateId(), name, class: cls };
    studentsList.push(newStudent);
    saveJSON(STUDENTS_LIST_KEY, studentsList);
    activeStudentId = newStudent.id;
    saveJSON(ACTIVE_STUDENT_KEY, activeStudentId);
    await loginStudent(newStudent);
  });

  nextLevelBtn.addEventListener('click', () => {
    const next = findNextLevel(progress.currentLevel);
    if (next) openLevel(next.id);
  });

  async function init() {
    const savedList = loadJSON(STUDENTS_LIST_KEY);
    studentsList = Array.isArray(savedList) ? savedList : [];

    const savedActiveId = loadJSON(ACTIVE_STUDENT_KEY);
    if (savedActiveId) activeStudentId = savedActiveId;

    if (studentsList.length === 0) {
      showAddStudentForm();
      return;
    }
    if (activeStudentId) {
      const student = studentsList.find(s => s.id === activeStudentId);
      if (student) { await loginStudent(student); return; }
    }
    showStudentSelection();
  }

  window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
