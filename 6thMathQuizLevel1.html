<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3‑Digit Multiplication Quiz · Digits 6–9</title>
    <style>
        :root {
            --green: #123c35;
            --green2: #1d5b4e;
            --gold: #e7b95b;
            --cream: #fbf8ef;
            --ink: #172b27;
            --muted: #66736e;
            --red: #a83e37;
            --card-bg: #ffffff;
            --border-light: #e5e5d9;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: linear-gradient(145deg, #e9f0e9, #f8f4e9);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 22px 16px 44px;
        }
        .quiz-card {
            max-width: 820px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 8px 25px #172b270d;
            padding: clamp(18px, 4vw, 30px);
            transition: all 0.2s;
        }
        h1 {
            font-size: clamp(22px, 5vw, 32px);
            margin: 0 0 4px 0;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e5e5d9;
            padding-bottom: 16px;
            text-transform: capitalize;
        }
        .subhead {
            color: var(--muted);
            margin: 10px 0 20px 0;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-badge {
            background: #edf0e9;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            color: var(--green);
        }
        .question-area {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 20px 20px;
            margin: 10px 0 16px;
            border: 1px solid var(--border-light);
        }
        .question-text {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 600;
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .times, .equals {
            font-size: clamp(24px, 5vw, 32px);
            margin: 0 8px;
            color: var(--green2);
            font-weight: 400;
        }
        .question-mark {
            font-size: clamp(24px, 5vw, 32px);
            margin-left: 8px;
            color: var(--green);
            font-weight: 700;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 10px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            border-radius: 13px;
            padding: 16px 18px;
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            user-select: none;
        }
        .option-btn:hover:not(.disabled) {
            border-color: var(--green2);
            background: #f8fbf7;
        }
        .option-btn.selected {
            border-color: var(--green2);
            background: #edf5ef;
            box-shadow: 0 0 0 3px #1d5b4e25;
        }
        .option-btn.disabled {
            cursor: default;
            opacity: 0.75;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            color: var(--green);
            font-weight: 800;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: white;
            box-shadow: 0 10px 18px -8px #1b4e6470;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--green2);
            border-color: var(--green2);
            transform: scale(1.02);
        }
        .btn:hover:not(:disabled):not(.btn-primary) {
            background: #f0f4ed;
            border-color: #8ca99a;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .result-area {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 24px;
            margin: 16px 0;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .score-big {
            font-size: clamp(48px, 10vw, 64px);
            font-weight: 900;
            color: var(--green);
            line-height: 1.1;
        }
        .score-big small {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 400;
            color: var(--muted);
        }
        .score-message {
            font-size: clamp(16px, 3vw, 20px);
            font-weight: 500;
            margin: 18px 0;
            line-height: 1.5;
        }
        .congrats-message {
            font-size: clamp(18px, 3.5vw, 24px);
            font-weight: 700;
            margin: 18px 0;
            line-height: 1.5;
            color: #216342;
        }
        .hide {
            display: none !important;
        }
        @media (max-width: 650px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .quiz-card {
                padding: 16px;
            }
            h1 {
                font-size: 20px;
            }
            .question-text {
                font-size: 22px;
            }
            .option-btn {
                font-size: 18px;
                padding: 14px 16px;
            }
            .score-big {
                font-size: 42px;
            }
            .result-area {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
<div class="quiz-card">
    <h1>3‑Digit Multiplication Quiz</h1>
    <div class="subhead">
        <div id="statusText">Answer all 5 questions. Score shown at the end.</div>
        <div class="progress-badge" id="progressBadge">0 / 5</div>
    </div>

    <!-- QUESTION VIEW -->
    <div id="questionView">
        <div class="question-area">
            <div class="question-text" id="questionText">
                <!-- filled by JS -->
            </div>
            <div class="options-grid" id="optionsGrid">
                <!-- options filled by JS -->
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>
        </div>
    </div>

    <!-- RESULT VIEW (score only) -->
    <div id="resultView" class="hide">
        <div class="result-area">
            <div class="score-big" id="scoreDisplay">0<small>/5</small></div>
            <div class="score-message" id="scoreMessage"></div>
            <div class="congrats-message" id="congratsMessage" style="display: none;"></div>
            <div class="btn-group" id="resultButtons" style="margin-top: 24px;">
                <button class="btn" id="tryAgainBtn">🔄 Try again</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- CONSTANTS ----------
        const STORAGE_KEY = 'three_digit_quiz_v1';
        const TOTAL_QUESTIONS = 5;
        const ALLOWED_DIGITS = [6, 7, 8, 9];

        // ---------- HELPER: generate all 3-digit numbers with distinct digits from 6-9 ----------
        function generateAll3DigitNumbers() {
            const nums = [];
            for (let a of ALLOWED_DIGITS) {
                for (let b of ALLOWED_DIGITS) {
                    if (b === a) continue;
                    for (let c of ALLOWED_DIGITS) {
                        if (c === a || c === b) continue;
                        nums.push(a * 100 + b * 10 + c);
                    }
                }
            }
            return nums;
        }

        const allNumbers = generateAll3DigitNumbers();
        console.log('All 3-digit numbers with distinct digits 6-9:', allNumbers);
        console.log('Count:', allNumbers.length);

        // ---------- HELPER: check if a number uses distinct digits from 6-9 ----------
        function isValidNumber(n) {
            if (n < 100 || n > 999) return false;
            const s = n.toString();
            if (s.length !== 3) return false;
            const digits = s.split('').map(Number);
            // all digits must be in {6,7,8,9}
            for (let d of digits) {
                if (!ALLOWED_DIGITS.includes(d)) return false;
            }
            // distinct digits
            if (new Set(digits).size !== 3) return false;
            return true;
        }

        // ---------- GENERATE SINGLE QUESTION ----------
        function generateOneQuestion(usedNums) {
            const MAX_ATTEMPTS = 5000;
            for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                const available = allNumbers.filter(n => !usedNums.has(n));
                if (available.length < 2) return null;
                const idx1 = Math.floor(Math.random() * available.length);
                const num1 = available[idx1];
                let idx2 = Math.floor(Math.random() * available.length);
                while (idx2 === idx1) idx2 = Math.floor(Math.random() * available.length);
                const num2 = available[idx2];

                // Safety check
                if (!isValidNumber(num1) || !isValidNumber(num2)) continue;

                const product = num1 * num2;
                // Product will be a 5 or 6 digit number, we'll just display it

                return {
                    num1: num1,
                    num2: num2,
                    product: product
                };
            }
            return null;
        }

        // ---------- GENERATE FULL SET OF QUESTIONS ----------
        function generateQuestionSet(N) {
            const usedNums = new Set();
            const questions = [];
            for (let q = 0; q < N; q++) {
                const question = generateOneQuestion(usedNums);
                if (!question) return null;
                usedNums.add(question.num1);
                usedNums.add(question.num2);
                questions.push(question);
            }
            return questions;
        }

        // ---------- BUILD OPTIONS (one correct, three distractors) ----------
        function buildOptions(correctProduct) {
            const correct = correctProduct;
            const distractorKeys = new Set();
            const distractors = [];

            // Generate plausible distractor products
            // Strategy: multiply two other 3-digit numbers from the pool, or perturb digits
            const MAX_ATTEMPTS = 2000;
            let attempts = 0;

            while (distractors.length < 3 && attempts < MAX_ATTEMPTS) {
                attempts++;
                // Pick two random numbers from allNumbers
                const idx1 = Math.floor(Math.random() * allNumbers.length);
                const idx2 = Math.floor(Math.random() * allNumbers.length);
                if (idx1 === idx2) continue;
                const a = allNumbers[idx1];
                const b = allNumbers[idx2];
                const candidate = a * b;

                if (candidate === correct) continue;
                if (distractorKeys.has(candidate)) continue;

                // Optionally perturb: sometimes use candidate ± small number
                let finalCandidate = candidate;
                const perturbRoll = Math.random();
                if (perturbRoll < 0.3) {
                    // small perturbation
                    const delta = Math.floor(Math.random() * 200) - 100;
                    finalCandidate = Math.max(100000, candidate + delta);
                }

                if (finalCandidate === correct) continue;
                if (distractorKeys.has(finalCandidate)) continue;

                distractorKeys.add(finalCandidate);
                distractors.push(finalCandidate);
            }

            // Fallback: generate random numbers near the correct product
            while (distractors.length < 3) {
                const delta = Math.floor(Math.random() * 2000) - 1000;
                const candidate = Math.max(100000, correct + delta);
                if (candidate === correct) continue;
                if (distractorKeys.has(candidate)) continue;
                distractorKeys.add(candidate);
                distractors.push(candidate);
            }

            const options = [correct, ...distractors.slice(0, 3)];
            // Shuffle
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return options.map(Number);
        }

        // ---------- STATE MANAGEMENT ----------
        let state = {
            questions: [],
            currentIndex: 0,
            answers: [],
            optionsList: [],
            completed: false,
            score: 0
        };

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) { console.warn('Could not save state', e); }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) { return null; }
        }

        function clearState() {
            localStorage.removeItem(STORAGE_KEY);
        }

        // ---------- RENDER CURRENT QUESTION ----------
        function renderCurrentQuestion() {
            if (state.completed) {
                renderResult();
                return;
            }
            const qIndex = state.currentIndex;
            if (qIndex >= state.questions.length) {
                state.completed = true;
                saveState();
                renderResult();
                return;
            }

            const q = state.questions[qIndex];
            const options = state.optionsList[qIndex];
            const selectedIdx = state.answers[qIndex];

            document.getElementById('progressBadge').textContent = `${qIndex + 1} / ${TOTAL_QUESTIONS}`;

            const qt = document.getElementById('questionText');
            qt.innerHTML = `
                <span style="font-weight:700;">${q.num1}</span>
                <span class="times">×</span>
                <span style="font-weight:700;">${q.num2}</span>
                <span class="equals">=</span>
                <span class="question-mark">?</span>
            `;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (selectedIdx === idx) btn.classList.add('selected');
                if (selectedIdx !== null && selectedIdx !== undefined) {
                    btn.classList.add('disabled');
                }
                btn.textContent = opt;
                btn.dataset.optIndex = idx;
                btn.addEventListener('click', () => {
                    if (state.answers[qIndex] !== null && state.answers[qIndex] !== undefined) return;
                    state.answers[qIndex] = idx;
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
                    document.getElementById('submitBtn').disabled = false;
                    saveState();
                });
                grid.appendChild(btn);
            });

            const submitBtn = document.getElementById('submitBtn');
            const alreadyAnswered = state.answers[qIndex] !== null && state.answers[qIndex] !== undefined;
            submitBtn.disabled = !alreadyAnswered;
            submitBtn.textContent = alreadyAnswered ? 'Next question →' : 'Submit answer';

            const newSubmit = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
            newSubmit.id = 'submitBtn';
            newSubmit.addEventListener('click', () => {
                if (state.answers[qIndex] === null || state.answers[qIndex] === undefined) return;
                if (state.currentIndex < TOTAL_QUESTIONS - 1) {
                    state.currentIndex++;
                    saveState();
                    renderCurrentQuestion();
                } else {
                    finalizeQuiz();
                }
            });

            document.getElementById('questionView').classList.remove('hide');
            document.getElementById('resultView').classList.add('hide');
            document.getElementById('statusText').textContent = `Question ${qIndex + 1} of ${TOTAL_QUESTIONS}`;
        }

        // ---------- FINALIZE QUIZ ----------
        function finalizeQuiz() {
            let score = 0;
            state.questions.forEach((q, idx) => {
                const ansIdx = state.answers[idx];
                const options = state.optionsList[idx];
                const chosen = options[ansIdx];
                const correct = q.product;
                if (chosen === correct) {
                    score++;
                }
            });
            state.score = score;
            state.completed = true;
            saveState();
            renderResult();
        }

        // ---------- RENDER RESULT (score only, try again only if not perfect) ----------
        function renderResult() {
            document.getElementById('questionView').classList.add('hide');
            document.getElementById('resultView').classList.remove('hide');

            const score = state.score;
            const total = TOTAL_QUESTIONS;

            document.getElementById('scoreDisplay').innerHTML = `${score}<small>/${total}</small>`;
            const msgEl = document.getElementById('scoreMessage');
            const congratsEl = document.getElementById('congratsMessage');
            const tryAgainBtn = document.getElementById('tryAgainBtn');

            if (score === total) {
                // Perfect score: congratulate, hide Try Again
                msgEl.textContent = '';
                msgEl.style.display = 'none';
                congratsEl.style.display = 'block';
                congratsEl.textContent = '🎉 Congratulations! You scored a perfect 5/5! Excellent work!';
                tryAgainBtn.style.display = 'none';
            } else {
                // Not perfect: show score, show Try Again
                msgEl.style.display = 'block';
                msgEl.textContent = `You scored ${score}/${total}. Try again to improve your score.`;
                msgEl.style.color = '#a83e37';
                congratsEl.style.display = 'none';
                tryAgainBtn.style.display = 'inline-flex';
            }

            const newTryBtn = tryAgainBtn.cloneNode(true);
            tryAgainBtn.parentNode.replaceChild(newTryBtn, tryAgainBtn);
            newTryBtn.id = 'tryAgainBtn';
            newTryBtn.addEventListener('click', () => {
                resetAndStartNewQuiz();
            });

            document.getElementById('statusText').textContent = 'Quiz completed';
            document.getElementById('progressBadge').textContent = `${total} / ${total}`;
        }

        // ---------- START / RESET ----------
        function startNewQuiz() {
            let questions = null;
            let attempts = 0;
            const maxGenAttempts = 300;
            while (attempts < maxGenAttempts && !questions) {
                questions = generateQuestionSet(TOTAL_QUESTIONS);
                attempts++;
            }
            if (!questions) {
                alert('Could not generate a valid quiz. Please refresh the page or try again.');
                return;
            }

            const optionsList = questions.map(q => buildOptions(q.product));

            state = {
                questions: questions,
                currentIndex: 0,
                answers: new Array(TOTAL_QUESTIONS).fill(null),
                optionsList: optionsList,
                completed: false,
                score: 0
            };
            saveState();
            renderCurrentQuestion();
        }

        function resetAndStartNewQuiz() {
            clearState();
            startNewQuiz();
        }

        // ---------- INIT ----------
        window.addEventListener('DOMContentLoaded', () => {
            const saved = loadState();
            if (saved && saved.questions && saved.questions.length === TOTAL_QUESTIONS) {
                state = saved;
                if (!state.optionsList || state.optionsList.length !== TOTAL_QUESTIONS) {
                    state.optionsList = state.questions.map(q => buildOptions(q.product));
                }
                if (!state.answers || state.answers.length !== TOTAL_QUESTIONS) {
                    state.answers = new Array(TOTAL_QUESTIONS).fill(null);
                }
                if (state.completed === undefined) state.completed = false;
                if (state.score === undefined) state.score = 0;

                // Sanitize options
                state.optionsList = state.optionsList.map(optArr =>
                    optArr.map(opt => Number(opt))
                );

                if (state.completed) {
                    renderResult();
                } else {
                    renderCurrentQuestion();
                }
            } else {
                startNewQuiz();
            }

            window.addEventListener('beforeunload', () => {
                if (state && state.questions) saveState();
            });
        });

        window.__quizState = () => state;
        window.__resetQuiz = resetAndStartNewQuiz;
    })();
</script>
</body>
</html>
