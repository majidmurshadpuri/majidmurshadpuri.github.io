<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Page</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: #f5f6f8;
      color: #1a1a1a;
    }

    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ---------- Card ---------- */
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      transition: box-shadow .2s ease;
    }
    .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); }

    /* ---------- Card header (click to toggle) ---------- */
    .card-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      width: 100%;
      padding: 1rem 1.25rem;
      background: none;
      border: none;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      color: inherit;
    }
    .card-header:hover { background: #fafafa; }
    .card-header:focus-visible {
      outline: 2px solid #4a7dff;
      outline-offset: -2px;
    }

    /* Chevron icon rotates when open */
    .chevron {
      margin-left: auto;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      transition: transform .25s ease;
      color: #888;
    }
    .card[open] .chevron { transform: rotate(90deg); }

    /* ---------- Collapsible body ---------- */
    .card-body {
      display: grid;
      grid-template-rows: 0fr;      /* collapsed by default */
      transition: grid-template-rows .3s ease;
    }
    .card[open] .card-body {
      grid-template-rows: 1fr;       /* expanded */
    }
    .card-body-inner {
      overflow: hidden;              /* required for the grid trick */
    }

    /* ---------- The iframe ---------- */
    .card iframe {
      display: block;
      width: 100%;
      border: none;
      border-top: 1px solid #eee;
      height: 0;                     /* JS will set real height when opened */
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ===================== CARD 1 ===================== -->
    <section class="card" id="card1">
      <button class="card-header" aria-expanded="false" aria-controls="body1">
        <span>File 1</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
      </button>
      <div class="card-body" id="body1" role="region">
        <div class="card-body-inner">
          <!-- lazy-loaded: data-src set, src assigned on first open -->
          <iframe data-src="file1.html" title="File 1"></iframe>
        </div>
      </div>
    </section>

    <!-- ===================== CARD 2 ===================== -->
    <section class="card" id="card2">
      <button class="card-header" aria-expanded="false" aria-controls="body2">
        <span>File 2</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
      </button>
      <div class="card-body" id="body2" role="region">
        <div class="card-body-inner">
          <iframe data-src="file2.html" title="File 2"></iframe>
        </div>
      </div>
    </section>

  </div>

  <script>
    document.querySelectorAll('.card').forEach(card => {
      const header = card.querySelector('.card-header');
      const iframe = card.querySelector('iframe');

      header.addEventListener('click', () => {
        const isOpen = card.hasAttribute('open');

        // Lazy-load the iframe the first time the card opens
        if (!isOpen && !iframe.getAttribute('src')) {
          iframe.src = iframe.dataset.src;
        }

        // Toggle state
        card.toggleAttribute('open', !isOpen);
        header.setAttribute('aria-expanded', String(!isOpen));

        // Once expanded, size the iframe to its content
        if (!isOpen) {
          const fit = () => {
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              iframe.style.height = doc.documentElement.scrollHeight + 'px';
            } catch (e) {
              iframe.style.height = '600px';
            }
          };
          // Wait for load (first time) or run immediately if already loaded
          if (iframe.dataset.loaded) {
            fit();
          } else {
            iframe.addEventListener('load', () => {
              iframe.dataset.loaded = '1';
              fit();
            }, { once: true });
          }
        } else {
          // Collapsing: reset height so it doesn't affect layout
          iframe.style.height = '0';
        }
      });
    });
  </script>

</body>
</html>
