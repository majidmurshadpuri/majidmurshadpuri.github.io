<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greatest / Smallest Decimal (Sub-1) — Unpredictable Traps</title>
    <style>
        :root {
            --green: #123c35;
            --green2: #1d5b4e;
            --gold: #e7b95b;
            --ink: #172b27;
            --muted: #66736e;
            --red: #a83e37;
            --card-bg: #ffffff;
            --border-light: #e5e5d9;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; width: 100%; }
        body {
            background: linear-gradient(145deg, #e9f0e9, #f8f4e9);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            padding: 1.2vh 1.2vw;
            overflow-x: hidden;
        }
        .quiz-card {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 8px 25px #172b270d;
            padding: clamp(16px, 3.5vh, 30px) clamp(16px, 4vw, 30px);
            margin: auto;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: clamp(20px, 3.5vh, 32px);
            margin: 0 0 4px 0;
            border-bottom: 2px solid #e5e5d9;
            padding-bottom: clamp(10px, 1.8vh, 16px);
        }
        .subhead {
            color: var(--muted);
            margin: clamp(8px, 1.5vh, 12px) 0 clamp(14px, 2.5vh, 20px) 0;
            font-size: clamp(13px, 1.6vh, 15px);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-badge {
            background: #edf0e9;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: clamp(12px, 1.4vh, 13px);
            font-weight: 800;
            color: var(--green);
        }
        .question-area {
            background: #ffffff;
            border-radius: 16px;
            padding: clamp(14px, 2.5vh, 24px) clamp(14px, 2.5vw, 20px);
            margin: clamp(8px, 1.5vh, 10px) 0 clamp(10px, 2vh, 16px);
            border: 1px solid var(--border-light);
        }
        .question-text {
            font-size: clamp(20px, 4vh, 32px);
            font-weight: 600;
            color: var(--green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: clamp(14px, 2.5vh, 24px);
            text-align: center;
            line-height: 1.4;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(8px, 1.5vh, 14px);
            margin-top: clamp(6px, 1vh, 10px);
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            border-radius: 13px;
            padding: clamp(10px, 2vh, 16px) clamp(12px, 2vw, 18px);
            font-size: clamp(18px, 3vh, 26px);
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            user-select: none;
            text-align: center;
            min-height: 60px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            word-break: break-all;
        }
        .option-btn:hover:not(.disabled) { border-color: var(--green2); background: #f8fbf7; }
        .option-btn.selected { border-color: var(--green2); background: #edf5ef; box-shadow: 0 0 0 3px #1d5b4e25; }
        .option-btn.disabled { cursor: default; opacity: 0.75; }
        .btn-group {
            display: flex; flex-wrap: wrap;
            gap: clamp(10px, 1.5vh, 14px);
            justify-content: center;
            margin-top: clamp(12px, 2vh, 20px);
        }
        .btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            color: var(--green);
            font-weight: 800;
            padding: clamp(9px, 1.5vh, 12px) clamp(18px, 2.5vw, 24px);
            border-radius: 12px;
            font-size: clamp(14px, 1.8vh, 15px);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: white;
            box-shadow: 0 10px 18px -8px #1b4e6470;
        }
        .btn-primary:hover:not(:disabled) { background: var(--green2); border-color: var(--green2); transform: scale(1.02); }
        .btn:hover:not(:disabled):not(.btn-primary) { background: #f0f4ed; border-color: #8ca99a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .result-area {
            background: #ffffff;
            border-radius: 16px;
            padding: clamp(20px, 4vh, 32px) clamp(16px, 3vw, 24px);
            margin: clamp(12px, 2vh, 16px) 0;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .score-big {
            font-size: clamp(40px, 8vh, 64px);
            font-weight: 900;
            color: var(--green);
            line-height: 1.1;
        }
        .score-big small { font-size: clamp(20px, 4vh, 32px); font-weight: 400; color: var(--muted); }
        .score-message {
            font-size: clamp(15px, 2.2vh, 20px);
            font-weight: 500;
            margin: clamp(12px, 2vh, 18px) 0;
            line-height: 1.5;
        }
        .congrats-message {
            font-size: clamp(16px, 2.6vh, 24px);
            font-weight: 700;
            margin: clamp(12px, 2vh, 18px) 0;
            line-height: 1.5;
            color: #216342;
        }
        .hide { display: none !important; }
        .direction-badge {
            display: inline-block;
            background: var(--gold);
            color: #3d2f10;
            font-weight: 900;
            font-size: clamp(12px, 1.8vh, 15px);
            padding: 5px 18px;
            border-radius: 30px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .question-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2vw, 16px);
            margin-top: 8px;
        }
        .number-chip {
            background: #f2f7f1;
            border: 2px solid #d3e0d5;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: clamp(18px, 3.2vh, 28px);
            font-weight: 800;
            color: var(--green2);
            font-family: 'Courier New', monospace;
            letter-spacing: 1.5px;
            word-break: break-all;
        }
        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; }
            .quiz-card { padding: 14px; }
            h1 { font-size: 20px; }
            .question-text { font-size: 20px; }
            .option-btn { font-size: 16px; padding: 12px 14px; }
            .score-big { font-size: 42px; }
            .result-area { padding: 20px 14px; }
            .number-chip { font-size: 16px; padding: 8px 12px; }
        }
    </style>
</head>
<body>
<div class="quiz-card">
    <h1>Greatest / Smallest Decimal (&lt; 1)</h1>
    <div class="subhead">
        <div id="statusText">Answer all 5 questions. Score shown at the end.</div>
        <div class="progress-badge" id="progressBadge">0 / 5</div>
    </div>

    <div id="questionView">
        <div class="question-area">
            <div style="text-align:center;">
                <span class="direction-badge" id="directionBadge">Greatest</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>
        </div>
    </div>

    <div id="resultView" class="hide">
        <div class="result-area">
            <div class="score-big" id="scoreDisplay">0<small>/5</small></div>
            <div class="score-message" id="scoreMessage"></div>
            <div class="congrats-message" id="congratsMessage" style="display: none;"></div>
            <div class="btn-group" id="resultButtons" style="margin-top: 24px;">
                <button class="btn" id="tryAgainBtn">🔄 Try again</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // =====================================================================
        // SUB-1 DECIMAL COMPARISON QUIZ
        // Rules enforced on every question:
        //  • Integer part is always zero (may be omitted, e.g. ".45").
        //  • Random number of leading zeros before the decimal (0–4).
        //  • Fractional lengths vary across the four options.
        //  • Traps: leading zeros after the point, trailing zeros, repeated
        //    digits, near-identical numbers differing only far out.
        //  • Anti-predictability: correct answer must NOT be the visually
        //    longest/shortest, must NOT be the only option with most/fewest
        //    digits, and correct position is balanced across A–D.
        // =====================================================================

        const TOTAL_QUESTIONS = 5;
        const STORAGE_KEY = 'sub1_decimal_compare_quiz_v1';

        // ---------- precise decimal-string comparison ----------
        function compareDecimalStrings(a, b) {
            const [ai, af = ''] = String(a).split('.');
            const [bi, bf = ''] = String(b).split('.');
            const intLen = Math.max(ai.length, bi.length);
            const Aint = ai.padStart(intLen, '0');
            const Bint = bi.padStart(intLen, '0');
            if (Aint < Bint) return -1;
            if (Aint > Bint) return 1;
            const fracLen = Math.max(af.length, bf.length);
            const Af = af.padEnd(fracLen, '0');
            const Bf = bf.padEnd(fracLen, '0');
            if (Af < Bf) return -1;
            if (Af > Bf) return 1;
            return 0;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
        function randDigit(lo = 0, hi = 9) { return randInt(lo, hi); }

        function leadingZerosCount(s) {
            // number of zeros in the integer part
            return s.split('.')[0].length;
        }
        function fracLen(s) {
            const p = s.split('.');
            return p.length > 1 ? p[1].length : 0;
        }
        function totalDigits(s) { return s.replace('.', '').length; }
        function isDotPrefix(s) { return s.startsWith('.'); }

        // Format a fractional string with a random leading-zero integer part
        function withRandomLeadingZeros(fracStr) {
            const r = Math.random();
            if (r < 0.35) {
                // dot-prefixed form: .frac
                return '.' + fracStr;
            }
            // 0., 00., 000., 0000. form
            const n = randInt(1, 4);
            return '0'.repeat(n) + '.' + fracStr;
        }

        // ---------- core validator + anti-predictability ----------
        function buildQuestion(displays, forcedDirection) {
            if (!Array.isArray(displays) || displays.length !== 4) return null;
            for (const s of displays) {
                if (typeof s !== 'string' || s.length === 0) return null;
                const dotCount = (s.match(/\./g) || []).length;
                if (dotCount !== 1) return null;
                const [ip, fp] = s.split('.');
                if (fp.length === 0) return null;
                if (!/^\d*$/.test(ip)) return null;
                if (!/^\d+$/.test(fp)) return null;
                // integer part must be all zeros (including empty for ".x")
                if (ip.length > 0 && !/^0+$/.test(ip)) return null;
            }

            const opts = displays.map(s => ({ str: s, val: parseFloat(s) }));
            if (new Set(opts.map(o => o.str)).size !== 4) return null;
            if (new Set(opts.map(o => o.val)).size !== 4) return null;

            // Must all be < 1 (guaranteed by integer part being zeros)
            // Fractional lengths must vary (at least 3 distinct lengths)
            const fracLens = opts.map(o => fracLen(o.str));
            if (new Set(fracLens).size < 3) return null;
            // Total display lengths must vary (at least 3 distinct)
            const lens = opts.map(o => o.str.length);
            if (new Set(lens).size < 3) return null;

            for (let i = 0; i < opts.length; i++)
                for (let j = i + 1; j < opts.length; j++)
                    if (compareDecimalStrings(opts[i].str, opts[j].str) === 0) return null;

            const direction = forcedDirection || (Math.random() < 0.5 ? 'greatest' : 'smallest');
            const sorted = [...opts].sort((a, b) => compareDecimalStrings(a.str, b.str));
            const correctStr = direction === 'greatest' ? sorted[3].str : sorted[0].str;
            const correctObj = opts.find(o => o.str === correctStr);
            const others = opts.filter(o => o.str !== correctStr);

            // ---- ANTI-PREDICTABILITY ----
            // 1. correct must not be visually the strictly longest
            const maxLen = Math.max(...lens);
            if (correctObj.str.length === maxLen && lens.filter(l => l === maxLen).length === 1) return null;
            // 2. correct must not be visually the strictly shortest
            const minLen = Math.min(...lens);
            if (correctObj.str.length === minLen && lens.filter(l => l === minLen).length === 1) return null;

            // 3. at least one other has more total digits, one has fewer
            const cDigits = totalDigits(correctStr);
            if (!others.some(o => totalDigits(o.str) > cDigits)) return null;
            if (!others.some(o => totalDigits(o.str) < cDigits)) return null;

            // 4. correct must not be the only option with the fewest leading zeros
            const cLead = leadingZerosCount(correctStr);
            const leads = opts.map(o => leadingZerosCount(o.str));
            const minLead = Math.min(...leads);
            const maxLead = Math.max(...leads);
            if (cLead === minLead && leads.filter(l => l === minLead).length === 1) return null;
            if (cLead === maxLead && leads.filter(l => l === maxLead).length === 1) return null;

            // 5. correct must not be the only dot-prefixed form
            const dotCount = opts.filter(o => isDotPrefix(o.str)).length;
            if (dotCount === 1 && isDotPrefix(correctStr)) return null;

            // 6. at least 2 distinct fractional lengths among all options
            if (new Set(fracLens).size < 2) return null;

            // 7. correct must not have the strictly longest fractional part
            const cFrac = fracLen(correctStr);
            if (others.every(o => fracLen(o.str) < cFrac)) return null;
            // 8. correct must not have the strictly shortest fractional part
            if (others.every(o => fracLen(o.str) > cFrac)) return null;

            return { direction, options: shuffle(opts), correct: correctStr };
        }

        // =====================================================================
        // GENERATORS — each returns a question object or null
        // =====================================================================

        // G1: Classic more-digits-is-smaller trap
        // .9  >  .87  >  .879  >  .8789
        function genMoreDigitsSmaller() {
            const h = randInt(7, 9);
            const low = randInt(1, h - 1);
            const m = randDigit();
            const n = randDigit();
            const p = randDigit();

            const f1 = String(h);
            const f2 = `${low}${m}`;
            const f3 = `${low}${m}${n}`;
            const f4 = `${low}${m}${n}${p}`;

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            return buildQuestion(arr);
        }

        // G2: Leading zeros after the decimal point
        // .5  >  .05  >  .005  >  .0005
        function genLeadingFracZeros() {
            const nz = randInt(1, 9);
            const z1 = randInt(0, 1);
            const z2 = z1 + randInt(1, 2);
            const z3 = z2 + randInt(1, 2);

            const f1 = `${nz}`;
            const f2 = '0'.repeat(z1 + 1) + nz;
            const f3 = '0'.repeat(z2 + 1) + nz;
            const f4 = '0'.repeat(z3 + 1) + nz + randDigit();

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            return buildQuestion(arr);
        }

        // G3: Trailing zeros — same visual start, different value
        // .5  vs  .5001  vs  .4999  vs  .50001
        function genTrailingZeroTrap() {
            const a = '5';
            const b = `50${randInt(1, 9)}`;
            const c = `49${randInt(10, 99)}`;
            const d = `500${randInt(1, 9)}`;

            const arr = [a, b, c, d].map(withRandomLeadingZeros);
            return buildQuestion(arr);
        }

        // G4: Repeated digits with late difference
        function genRepeatedLateDiff() {
            const d = randInt(3, 9);
            const len = randInt(4, 7);
            let base = String(d).repeat(len);
            const f1 = base;
            const f2 = base + randDigit();
            const f3 = base.slice(0, -1) + (d - 1) + randDigit();
            const f4 = base.slice(0, -2) + (d - 1) + randDigit() + randDigit();

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            const vals = arr.map(parseFloat);
            if (new Set(vals).size < 4) return null;
            return buildQuestion(arr);
        }

        // G5: Long shared prefix, decisive late digits
        function genSharedPrefix() {
            const prefixLen = randInt(5, 9);
            let prefix = '';
            for (let i = 0; i < prefixLen; i++) prefix += randDigit();

            const f1 = prefix + '1';
            const f2 = prefix + '19';
            const f3 = prefix + '2';
            const f4 = prefix + '199';

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            const vals = arr.map(parseFloat);
            if (new Set(vals).size < 4) return null;
            return buildQuestion(arr);
        }

        // G6: Near-identical numbers differing in one distant place
        function genNearIdentical() {
            const len = randInt(4, 7);
            let base = '';
            for (let i = 0; i < len; i++) base += randDigit(1, 9);
            const pos = randInt(1, len - 1);

            const f1 = base;
            const f2 = base.slice(0, pos) + ((parseInt(base[pos]) + 1) % 10 || 1) + base.slice(pos + 1);
            const f3 = base.slice(0, pos) + ((parseInt(base[pos]) + 2) % 10 || 1) + base.slice(pos + 1);
            const f4 = base.slice(0, pos) + ((parseInt(base[pos]) + 3) % 10 || 1) + base.slice(pos + 1);

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            const vals = arr.map(parseFloat);
            if (new Set(vals).size < 4) return null;
            return buildQuestion(arr);
        }

        // G7: Mixed lengths, all < 1
        // .9  vs  .89  vs  .889  vs  .8889
        function genMixedLengths() {
            const h = randInt(8, 9);
            const low = randInt(1, h - 1);

            const f1 = String(h);
            const f2 = `${low}${randInt(1, 9)}`;
            const f3 = `${low}${randInt(1, 9)}${randInt(1, 9)}`;
            const f4 = `${low}${randInt(1, 9)}${randInt(1, 9)}${randInt(1, 9)}`;

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            return buildQuestion(arr);
        }

        // G8: Zeros between significant digits
        function genInnerZeros() {
            const nz = randInt(1, 9);
            const f1 = String(nz);
            const f2 = `0${nz}`;
            const f3 = `00${nz}`;
            const f4 = `000${nz}${randDigit()}`;

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            return buildQuestion(arr);
        }

        // G9: Mixed structure — short/long alternating
        // .7  vs  .69999  vs  .70  vs  .6999
        // (must avoid .70 == .7) — use .701
        function genAlternating() {
            const v = randInt(5, 9);
            const f1 = String(v);
            const f2 = `${v - 1}9${randDigit()}${randDigit()}`;
            const f3 = `${v}0${randDigit()}`;
            const f4 = `${v - 1}${randInt(7, 9)}${randDigit()}`;

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            const vals = arr.map(parseFloat);
            if (new Set(vals).size < 4) return null;
            return buildQuestion(arr);
        }

        // G10: Close numeric values via long tails
        // .1234561  vs  .1234562  vs  .12345611  vs  .12345612
        function genCloseLongTails() {
            const prefixLen = randInt(5, 8);
            let prefix = '';
            for (let i = 0; i < prefixLen; i++) prefix += randDigit(1, 9);

            const f1 = prefix + '1';
            const f2 = prefix + '2';
            const f3 = prefix + '11';
            const f4 = prefix + '12';

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            const vals = arr.map(parseFloat);
            if (new Set(vals).size < 4) return null;
            return buildQuestion(arr);
        }

        // G11: Zeros after decimal, varying count
        // .5  vs  .05  vs  .005  vs  .0005 (but with different final values)
        function genFracZeroLadder() {
            const nz = randInt(2, 9);
            const f1 = `${nz}`;
            const f2 = `0${nz}${randDigit()}`;
            const f3 = `00${nz}${randDigit()}`;
            const f4 = `000${nz}${randDigit()}${randDigit()}`;

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            return buildQuestion(arr);
        }

        // G12: Repeated 9s with break
        // .999999  vs  .9999999  vs  .9999998  vs  .99999999
        function genRepeated9s() {
            const len = randInt(4, 7);
            const base = '9'.repeat(len);
            const f1 = base;
            const f2 = base + '9';
            const f3 = base.slice(0, -1) + '8' + randDigit(1, 9);
            const f4 = base + '99';

            const arr = [f1, f2, f3, f4].map(withRandomLeadingZeros);
            const vals = arr.map(parseFloat);
            if (new Set(vals).size < 4) return null;
            return buildQuestion(arr);
        }

        // =====================================================================
        const GENERATORS = [
            genMoreDigitsSmaller, genLeadingFracZeros, genTrailingZeroTrap,
            genRepeatedLateDiff, genSharedPrefix, genNearIdentical,
            genMixedLengths, genInnerZeros, genAlternating, genCloseLongTails,
            genFracZeroLadder, genRepeated9s
        ];

        function generateQuiz() {
            const usedKeys = new Set();
            const questions = [];
            const pool = shuffle([...GENERATORS]);
            const correctPositions = [];

            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                let q = null;
                for (let t = 0; t < 300 && !q; t++) {
                    const gen = pool[(i + t) % pool.length];
                    try {
                        const candidate = gen();
                        if (!candidate) continue;
                        const key = candidate.direction + '|' +
                            candidate.options.map(o => o.str).sort().join('|');
                        if (usedKeys.has(key)) continue;
                        const pos = candidate.options.findIndex(o => o.str === candidate.correct);
                        // avoid 3-in-a-row same position
                        if (correctPositions.length >= 2 &&
                            correctPositions[correctPositions.length - 1] === pos &&
                            correctPositions[correctPositions.length - 2] === pos) continue;
                        usedKeys.add(key);
                        correctPositions.push(pos);
                        q = candidate;
                    } catch (e) { continue; }
                }
                if (!q) { q = buildFallbackQuestion(i); if (!q) return null; }
                questions.push(q);
            }

            // balance directions
            let g = questions.filter(q => q.direction === 'greatest').length;
            let s = TOTAL_QUESTIONS - g;
            if (g === 0 || s === 0) {
                const idx = randInt(0, TOTAL_QUESTIONS - 1);
                const q = questions[idx];
                const sorted = [...q.options].sort((a, b) => compareDecimalStrings(a.str, b.str));
                q.direction = (q.direction === 'greatest') ? 'smallest' : 'greatest';
                q.correct = q.direction === 'greatest' ? sorted[3].str : sorted[0].str;
            } else if (g >= 4 || s >= 4) {
                // force at least 2 of the minority direction
                const wantDir = (g >= 4) ? 'smallest' : 'greatest';
                const idx = questions.findIndex(q => q.direction !== wantDir);
                if (idx >= 0) {
                    const q = questions[idx];
                    const sorted = [...q.options].sort((a, b) => compareDecimalStrings(a.str, b.str));
                    q.direction = wantDir;
                    q.correct = wantDir === 'greatest' ? sorted[3].str : sorted[0].str;
                }
            }

            return questions;
        }

        function buildFallbackQuestion(seed) {
            const variants = [
                { disp: ['.9', '.87', '.879', '.8789'] },
                { disp: ['.5', '.05', '.005', '.0005'] },
                { disp: ['.5', '.5001', '.4999', '.50001'] },
                { disp: ['.1234561', '.1234562', '.12345611', '.12345612'] },
                { disp: ['.777777', '.777778', '.777779', '.7777777'] }
            ];
            const v = variants[seed % variants.length];
            return buildQuestion(v.disp);
        }

        // =====================================================================
        // QUIZ ENGINE
        // =====================================================================
        let state = {
            questions: [],
            currentIndex: 0,
            answers: new Array(TOTAL_QUESTIONS).fill(null),
            completed: false,
            score: 0
        };

        function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
        function loadState() {
            try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
        }
        function clearState() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }

        function renderCurrentQuestion() {
            if (state.completed) { renderResult(); return; }
            const qIndex = state.currentIndex;
            if (qIndex >= TOTAL_QUESTIONS) { state.completed = true; saveState(); renderResult(); return; }

            const q = state.questions[qIndex];
            const selectedIdx = state.answers[qIndex];

            document.getElementById('progressBadge').textContent = `${qIndex + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById('statusText').textContent = `Question ${qIndex + 1} of ${TOTAL_QUESTIONS}`;
            const dirBadge = document.getElementById('directionBadge');
            dirBadge.textContent = q.direction === 'greatest' ? '⬆ Select the Greatest' : '⬇ Select the Smallest';

            const qt = document.getElementById('questionText');
            let listHTML = '<div class="question-list">';
            q.options.forEach((opt) => { listHTML += `<span class="number-chip">${opt.str}</span>`; });
            listHTML += '</div>';
            qt.innerHTML = listHTML +
                `<div style="font-size:clamp(14px,2.1vh,18px); margin-top:14px; color:var(--muted); font-weight:700;">
                    Which one is the ${q.direction} number?
                </div>`;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (selectedIdx === idx) btn.classList.add('selected');
                btn.textContent = opt.str;
                btn.addEventListener('click', () => {
                    if (state.completed) return;
                    state.answers[qIndex] = idx;
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    document.getElementById('submitBtn').disabled = false;
                    saveState();
                });
                grid.appendChild(btn);
            });

            const submitBtn = document.getElementById('submitBtn');
            const hasSelection = state.answers[qIndex] !== null && state.answers[qIndex] !== undefined;
            submitBtn.disabled = !hasSelection;
            submitBtn.textContent = hasSelection ? (qIndex === TOTAL_QUESTIONS - 1 ? 'Finish quiz →' : 'Next question →') : 'Submit answer';

            const newSubmit = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
            newSubmit.id = 'submitBtn';
            newSubmit.addEventListener('click', () => {
                if (state.answers[qIndex] === null || state.answers[qIndex] === undefined) return;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
                if (state.currentIndex < TOTAL_QUESTIONS - 1) {
                    state.currentIndex++;
                    saveState();
                    renderCurrentQuestion();
                } else {
                    finalizeQuiz();
                }
            });

            document.getElementById('questionView').classList.remove('hide');
            document.getElementById('resultView').classList.add('hide');
        }

        function finalizeQuiz() {
            let score = 0;
            state.questions.forEach((q, idx) => {
                const ansIdx = state.answers[idx];
                if (ansIdx === null || ansIdx === undefined) return;
                if (q.options[ansIdx].str === q.correct) score++;
            });
            state.score = score;
            state.completed = true;
            saveState();
            renderResult();
        }

        function renderResult() {
            document.getElementById('questionView').classList.add('hide');
            document.getElementById('resultView').classList.remove('hide');
            const score = state.score;
            document.getElementById('scoreDisplay').innerHTML = `${score}<small>/${TOTAL_QUESTIONS}</small>`;
            const msgEl = document.getElementById('scoreMessage');
            const congratsEl = document.getElementById('congratsMessage');
            const tryAgainBtn = document.getElementById('tryAgainBtn');
            if (score === TOTAL_QUESTIONS) {
                msgEl.style.display = 'none';
                congratsEl.style.display = 'block';
                congratsEl.textContent = '🎉 Perfect! You understand decimal place value!';
                tryAgainBtn.style.display = 'none';
            } else {
                msgEl.style.display = 'block';
                msgEl.textContent = `You scored ${score}/${TOTAL_QUESTIONS}. Remember: shorter isn't always bigger, and zeros can trick you!`;
                msgEl.style.color = '#a83e37';
                congratsEl.style.display = 'none';
                tryAgainBtn.style.display = 'inline-flex';
            }
            const newTryBtn = tryAgainBtn.cloneNode(true);
            tryAgainBtn.parentNode.replaceChild(newTryBtn, tryAgainBtn);
            newTryBtn.id = 'tryAgainBtn';
            newTryBtn.addEventListener('click', resetAndStartNewQuiz);
            document.getElementById('statusText').textContent = 'Quiz completed';
            document.getElementById('progressBadge').textContent = `${TOTAL_QUESTIONS} / ${TOTAL_QUESTIONS}`;
        }

        function startNewQuiz() {
            let questions = null;
            let attempts = 0;
            while (attempts < 150 && !questions) {
                try { questions = generateQuiz(); } catch (e) { questions = null; }
                attempts++;
            }
            if (!questions || questions.length !== TOTAL_QUESTIONS) {
                questions = [
                    { direction: 'greatest', options: [{str:'.9',val:0.9},{str:'.87',val:0.87},{str:'.879',val:0.879},{str:'.8789',val:0.8789}], correct: '.9' },
                    { direction: 'smallest', options: [{str:'.5',val:0.5},{str:'.05',val:0.05},{str:'.005',val:0.005},{str:'.0005',val:0.0005}], correct: '.0005' },
                    { direction: 'greatest', options: [{str:'.5001',val:0.5001},{str:'.5',val:0.5},{str:'.4999',val:0.4999},{str:'.50001',val:0.50001}], correct: '.5001' },
                    { direction: 'smallest', options: [{str:'.1234561',val:0.1234561},{str:'.1234562',val:0.1234562},{str:'.12345611',val:0.12345611},{str:'.12345612',val:0.12345612}], correct: '.1234561' },
                    { direction: 'greatest', options: [{str:'.777777',val:0.777777},{str:'.777778',val:0.777778},{str:'.777779',val:0.777779},{str:'.7777777',val:0.7777777}], correct: '.777779' }
                ];
            }
            state = { questions, currentIndex: 0, answers: new Array(TOTAL_QUESTIONS).fill(null), completed: false, score: 0 };
            saveState();
            renderCurrentQuestion();
        }

        function resetAndStartNewQuiz() { clearState(); startNewQuiz(); }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = loadState();
            if (saved && saved.questions && saved.questions.length === TOTAL_QUESTIONS && saved.answers && saved.answers.length === TOTAL_QUESTIONS) {
                state = saved;
                if (state.completed === undefined) state.completed = false;
                if (state.score === undefined) state.score = 0;
                if (state.completed) renderResult(); else renderCurrentQuestion();
            } else { startNewQuiz(); }
            window.addEventListener('beforeunload', () => { saveState(); });
        });

        window.__quizState = () => state;
        window.__resetQuiz = resetAndStartNewQuiz;
    })();
</script>
