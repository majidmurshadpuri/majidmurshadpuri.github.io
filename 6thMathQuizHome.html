<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz</title>
    <style>
        /* --- Design tokens --- */
        :root {
            --green: #123c35;
            --green2: #1d5b4e;
            --ink: #172b27;
            --muted: #66736e;
            --card-bg: #ffffff;
            --border-light: #e5e5d9;
            --red: #a83e37;
        }
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background: linear-gradient(145deg, #e9f0e9, #f8f4e9);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 22px 16px 44px;
            /* Forces desktop layout on mobile devices */
            min-width: 820px; 
            overflow-x: auto;
        }

        .main-wrapper {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        /* --- Header --- */
        .page-header {
            text-align: center;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 16px;
            position: relative;
        }
        .page-header h1 {
            font-size: clamp(24px, 5vw, 32px);
            margin: 0 0 10px 0;
            color: var(--ink);
        }
        .student-info {
            font-size: 16px;
            color: var(--muted);
            font-weight: 500;
        }
        .student-info strong {
            color: var(--green);
            font-weight: 700;
        }
        
        /* Switch Student Button */
        .switch-student-btn {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            background: transparent;
            border: 1px solid var(--muted);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .switch-student-btn:hover {
            background: var(--muted);
            color: white;
        }

        /* --- Forms & Overlays --- */
        .form-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            width: 100%;
        }
        .student-form {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 15px 35px #172b2715;
            text-align: center;
        }
        .student-form h2 {
            margin: 0 0 8px 0;
            font-size: 28px;
            color: var(--green);
        }
        .student-form p {
            color: var(--muted);
            margin: 0 0 28px 0;
            font-size: 15px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--ink);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e6e9e1;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            background: #ffffff;
            color: var(--ink);
            transition: border 0.15s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--green2);
            box-shadow: 0 0 0 3px #1d5b4e20;
        }
        
        /* --- Buttons --- */
        .btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            color: var(--green);
            font-weight: 800;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: white;
            box-shadow: 0 10px 18px -8px #1b4e6470;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--green2);
            border-color: var(--green2);
            transform: scale(1.02);
        }
        .btn-full { width: 100%; }
        .btn-secondary {
            background: #f0f4ed;
            border-color: #d0d9d3;
            color: var(--green);
        }
        .btn-secondary:hover {
            background: #e2e9e4;
        }
        
        .hide { display: none !important; }

        /* --- Student List (Switch Profile) --- */
        .student-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }
        .student-list-item {
            background: #f8faf7;
            border: 1px solid var(--border-light);
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            color: var(--ink);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s;
        }
        .student-list-item:hover {
            background: #edf2ee;
            border-color: var(--green2);
        }
        .student-list-item .class-tag {
            font-size: 13px;
            color: var(--muted);
            background: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* --- Integrated Iframe Area --- */
        .level-iframe-wrapper {
            width: 100%;
            background: transparent;
        }
        .level-iframe-wrapper iframe {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
            background: transparent;
        }
        
        /* --- Next Level Button Area --- */
        .next-level-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        
        <!-- ================= STUDENT SELECTION / SWITCH SCREEN ================= -->
        <div id="studentSelectionScreen" class="form-overlay hide">
            <div class="student-form">
                <h2>👥 Select Student</h2>
                <p>Choose your profile or add a new one.</p>
                
                <div id="studentListContainer" class="student-list">
                    <!-- Existing students injected by JS -->
                </div>

                <button class="btn btn-primary btn-full" id="showAddFormBtn" style="margin-bottom: 12px;">➕ Add New Student</button>
            </div>
        </div>

        <!-- ================= ADD NEW STUDENT FORM ================= -->
        <div id="addStudentFormOverlay" class="form-overlay hide">
            <div class="student-form">
                <h2>📋 New Student Details</h2>
                <p>Enter your name and class to begin the quiz.</p>
                <div class="form-group">
                    <label for="studentNameInput">Full name</label>
                    <input type="text" id="studentNameInput" placeholder="e.g. Aarav Sharma" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="studentClassSelect">Class</label>
                    <select id="studentClassSelect">
                        <option value="" disabled selected>Select your class</option>
                        <option value="5-A">5-A</option>
                        <option value="5-B">5-B</option>
                        <option value="6-A">6-A</option>
                        <option value="6-B">6-B</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select>
                </div>
                <button class="btn btn-primary btn-full" id="saveNewStudentBtn">🚀 Save & Start Quiz</button>
                <button class="btn btn-secondary btn-full hide" id="cancelAddStudentBtn" style="margin-top: 10px;">Cancel</button>
            </div>
        </div>

        <!-- ================= MAIN QUIZ AREA ================= -->
        <div id="quizArea" class="hide">
            <!-- HEADER -->
            <div class="page-header" id="pageHeader">
                <button class="switch-student-btn" id="switchStudentBtn">Switch Student</button>
                <h1>Math Quiz</h1>
                <div class="student-info" id="studentInfoText"></div>
            </div>

            <div class="level-iframe-wrapper">
                <iframe id="levelIframe" src="about:blank" title="Quiz level"></iframe>
            </div>
            <!-- Next Level Button (Controlled by Parent) -->
            <div class="next-level-wrapper hide" id="nextLevelWrapper">
                <button class="btn btn-primary" id="nextLevelBtn">🚀 Move to next level</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            // ---------- STORAGE KEYS ----------
            const STUDENTS_LIST_KEY = 'math_quiz_students_list_v1';
            const ACTIVE_STUDENT_KEY = 'math_quiz_active_student_id_v1';
            const PROGRESS_KEY_PREFIX = 'math_quiz_progress_v1_';

            // ---------- DOM refs ----------
            const studentSelectionScreen = document.getElementById('studentSelectionScreen');
            const studentListContainer = document.getElementById('studentListContainer');
            const showAddFormBtn = document.getElementById('showAddFormBtn');
            
            const addStudentFormOverlay = document.getElementById('addStudentFormOverlay');
            const studentNameInput = document.getElementById('studentNameInput');
            const studentClassSelect = document.getElementById('studentClassSelect');
            const saveNewStudentBtn = document.getElementById('saveNewStudentBtn');
            const cancelAddStudentBtn = document.getElementById('cancelAddStudentBtn');
            
            const quizArea = document.getElementById('quizArea');
            const studentInfoText = document.getElementById('studentInfoText');
            const switchStudentBtn = document.getElementById('switchStudentBtn');
            const levelIframe = document.getElementById('levelIframe');
            const nextLevelWrapper = document.getElementById('nextLevelWrapper');
            const nextLevelBtn = document.getElementById('nextLevelBtn');

            // ---------- State ----------
            let studentsList = []; // Array of { id, name, class }
            let activeStudentId = null;
            let activeStudent = null;
            let progress = null;
            let isNextLevelButtonShowing = false;

            // ---------- Helpers ----------
            function loadJSON(key) {
                try {
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : null;
                } catch(e) { return null; }
            }
            
            function saveJSON(key, obj) {
                try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e) {}
            }

            // Generate a simple unique ID
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substr(2);
            }

            // Automatically generate level URL based on ID with "6th" prefix
            function getLevelUrl(levelId) {
                return `6thMathQuizLevel${levelId}.html`;
            }

            // ---------- Screen Management ----------
            function hideAllScreens() {
                studentSelectionScreen.classList.add('hide');
                addStudentFormOverlay.classList.add('hide');
                quizArea.classList.add('hide');
                nextLevelWrapper.classList.add('hide');
            }

            function showStudentSelection() {
                hideAllScreens();
                studentSelectionScreen.classList.remove('hide');
                
                // Populate student list
                studentListContainer.innerHTML = '';
                if (studentsList.length === 0) {
                    studentListContainer.innerHTML = '<p style="text-align:center; color:var(--muted);">No students found. Add a new one below!</p>';
                } else {
                    studentsList.forEach(s => {
                        const div = document.createElement('div');
                        div.className = 'student-list-item';
                        div.innerHTML = `
                            <span>👤 ${s.name}</span>
                            <span class="class-tag">Class ${s.class}</span>
                        `;
                        div.addEventListener('click', () => {
                            activeStudentId = s.id;
                            saveJSON(ACTIVE_STUDENT_KEY, activeStudentId);
                            loginStudent(s);
                        });
                        studentListContainer.appendChild(div);
                    });
                }

                // Hide cancel button if there are no students (forced to add)
                if (studentsList.length === 0) {
                    cancelAddStudentBtn.classList.add('hide');
                }
            }

            function showAddStudentForm() {
                hideAllScreens();
                addStudentFormOverlay.classList.remove('hide');
                studentNameInput.value = '';
                studentClassSelect.value = '';
                
                // Show cancel button only if we already have students
                if (studentsList.length > 0) {
                    cancelAddStudentBtn.classList.remove('hide');
                } else {
                    cancelAddStudentBtn.classList.add('hide');
                }
            }

            function loginStudent(student) {
                activeStudent = student;
                loadProgress();
                hideAllScreens();
                quizArea.classList.remove('hide');
                updateHeaderText();
                loadLevel(progress.currentLevel || 1);
            }

            // ---------- Header & Progress ----------
            function updateHeaderText() {
                const currentLevelId = progress.currentLevel || 1;
                studentInfoText.innerHTML = `<strong>${activeStudent.name}</strong> (Class ${activeStudent.class}) - Level ${currentLevelId}`;
            }

            function getProgressKey() {
                return PROGRESS_KEY_PREFIX + activeStudentId;
            }

            function defaultProgress() {
                return {
                    currentLevel: 1,
                    completedLevels: {}
                };
            }

            function loadProgress() {
                const p = loadJSON(getProgressKey());
                if (p && typeof p === 'object') {
                    progress = { ...defaultProgress(), ...p };
                } else {
                    progress = defaultProgress();
                }
                if (!progress.completedLevels) progress.completedLevels = {};
            }

            function saveProgress() {
                saveJSON(getProgressKey(), progress);
            }

            // ---------- Level Navigation ----------
            function loadLevel(levelId, forceReload = false) {
                progress.currentLevel = levelId;
                saveProgress();
                updateHeaderText();

                const url = getLevelUrl(levelId);
                const absoluteUrl = new URL(url, window.location.href).href;

                if (levelIframe.src !== absoluteUrl || forceReload) {
                    levelIframe.src = url;
                }

                hideNextLevelButton();
                setupIframeWatcher();
            }

            function hideNextLevelButton() {
                nextLevelWrapper.classList.add('hide');
                isNextLevelButtonShowing = false;
            }

            function showNextLevelButton() {
                if (!isNextLevelButtonShowing) {
                    nextLevelWrapper.classList.remove('hide');
                    isNextLevelButtonShowing = true;
                }
            }

            // ---------- Watch Iframe State ----------
            let iframeWatcher = null;
            function setupIframeWatcher() {
                if (iframeWatcher) clearInterval(iframeWatcher);
                
                iframeWatcher = setInterval(() => {
                    try {
                        const win = levelIframe.contentWindow;
                        if (!win || !win.__quizState) return;
                        
                        const state = win.__quizState();
                        if (!state || !state.questions) return;

                        const levelId = progress.currentLevel;
                        const isCompleted = state.completed === true;
                        const score = state.score || 0;

                        if (isCompleted && score === 5) {
                            progress.completedLevels[levelId] = 5;
                            saveProgress();
                            showNextLevelButton();
                        } else {
                            if (progress.completedLevels[levelId] === 5) {
                                delete progress.completedLevels[levelId];
                                saveProgress();
                            }
                            hideNextLevelButton();
                        }
                    } catch(e) {
                        // Ignore errors if iframe is loading or cross-origin
                    }
                }, 500);
            }

            // ---------- Event Listeners ----------
            
            // Switch Student Button
            switchStudentBtn.addEventListener('click', () => {
                showStudentSelection();
            });

            // Show Add Student Form
            showAddFormBtn.addEventListener('click', () => {
                showAddStudentForm();
            });

            // Cancel Add Student
            cancelAddStudentBtn.addEventListener('click', () => {
                showStudentSelection();
            });

            // Save New Student
            saveNewStudentBtn.addEventListener('click', () => {
                const name = studentNameInput.value.trim();
                const cls = studentClassSelect.value;
                
                if (!name) { alert('Please enter the student\'s name.'); return; }
                if (!cls) { alert('Please select the class.'); return; }
                
                const newStudent = {
                    id: generateId(),
                    name: name,
                    class: cls
                };
                
                studentsList.push(newStudent);
                saveJSON(STUDENTS_LIST_KEY, studentsList);
                
                activeStudentId = newStudent.id;
                saveJSON(ACTIVE_STUDENT_KEY, activeStudentId);
                
                loginStudent(newStudent);
            });

            // Next Level Button
            nextLevelBtn.addEventListener('click', () => {
                const nextLevelId = progress.currentLevel + 1;
                loadLevel(nextLevelId, true);
            });

            // ---------- Initialize ----------
            function init() {
                // Load student list
                const savedList = loadJSON(STUDENTS_LIST_KEY);
                if (savedList && Array.isArray(savedList)) {
                    studentsList = savedList;
                } else {
                    studentsList = [];
                }

                // Load active student ID
                const savedActiveId = loadJSON(ACTIVE_STUDENT_KEY);
                if (savedActiveId) {
                    activeStudentId = savedActiveId;
                }

                // Determine which screen to show
                if (studentsList.length === 0) {
                    // First time user on this device
                    showAddStudentForm();
                } else if (activeStudentId) {
                    // Find the active student
                    const student = studentsList.find(s => s.id === activeStudentId);
                    if (student) {
                        loginStudent(student);
                    } else {
                        // Active ID not found in list (maybe corrupted), show selection
                        showStudentSelection();
                    }
                } else {
                    // No active student selected, show selection
                    showStudentSelection();
                }
            }

            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
