<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Worksheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff', 100: '#e0effe', 500: '#2563eb',
                            600: '#1d4ed8', 700: '#1e40af', 800: '#1e3a8a', 900: '#172554',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['Fira Code', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;600;700&display=swap');

        .math-digit { font-variant-numeric: tabular-nums; letter-spacing: 0.1em; }

        /* Single line equation styling */
        .equation-line {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 0.35rem;
            word-break: keep-all;
        }

        /* Print specific fixes */
        @media print {
            @page { 
                size: A4 portrait; 
                margin: 15mm; 
            }
            html, body { 
                background: white !important; 
                color: black !important; 
                margin: 0 !important; 
                padding: 0 !important;
                height: auto !important;
                min-height: auto !important;
                font-size: 12pt;
            }
            .no-print { 
                display: none !important; 
            }
            .max-w-7xl {
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            #printableWorksheet {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
            .printable-card {
                break-inside: avoid;
                page-break-inside: avoid;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                margin-bottom: 3rem !important;
            }
            
            /* Clean, balanced sizing for A4 */
            .print-math { font-size: 24pt !important; }
            .print-heading { font-size: 20pt !important; }
            .print-instr { font-size: 12pt !important; }
            .print-footer { font-size: 10pt !important; }
            
            /* Adjust grid for print to ensure 2 columns fit perfectly */
            #questionsGrid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 2rem !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">

    <!-- Top Navigation (Hidden on small screens) -->
    <header class="no-print hidden md:block bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
                    <i class="fa-solid fa-calculator"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight text-slate-900 dark:text-white">MathSheet Pro</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Worksheet Generator · 5 Questions</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="themeToggleBtn" title="Toggle Theme" class="p-2.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
                <button id="printBtn" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm shadow-sm transition">
                    <i class="fa-solid fa-print"></i> <span>Print / Save PDF</span>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Control Panel (non-printable) -->
        <div class="no-print bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 mb-6">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 dark:border-slate-700/60">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-brand-600"></i> Worksheet Configuration
                </h2>
                <!-- Mobile print button -->
                <button id="mobilePrintBtn" class="md:hidden flex items-center gap-2 px-3 py-1.5 rounded-lg bg-brand-600 text-white font-medium text-xs shadow-sm">
                    <i class="fa-solid fa-print"></i> Print
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="classSelect" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Class</label>
                    <select id="classSelect" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
                        <option value="5th A">5th A</option>
                        <option value="5th B" selected>5th B</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Problem Set</label>
                    <div class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-700 dark:text-slate-300">
                        Fixed: 5 mixed questions
                    </div>
                </div>

                <div class="flex items-end">
                    <div class="flex flex-wrap items-center gap-6">
                        <label class="inline-flex items-center gap-2 text-sm font-medium cursor-pointer">
                            <input type="checkbox" id="showAnswersToggle" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-slate-300">
                            <span>Show answers</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-end gap-3 mt-5 pt-4 border-t border-slate-100 dark:border-slate-700/60">
                <button id="generateBtn" class="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium text-sm flex items-center gap-2 shadow-sm transition">
                    <i class="fa-solid fa-arrows-rotate"></i> Regenerate
                </button>
            </div>
        </div>

        <!-- ================= WORKSHEET ================= -->
        <div id="printableWorksheet" class="bg-white text-slate-900 rounded-2xl shadow-md border border-slate-200 p-6 md:p-12 transition-all">

            <!-- Single main heading with date -->
            <div class="border-b-2 border-slate-800 pb-3 mb-6">
                <h1 id="displayTitle" class="print-heading text-xl md:text-2xl font-bold tracking-tight text-slate-900">Worksheet – Oct 27, 2026</h1>
            </div>

            <!-- Instruction banner -->
            <div id="instructionBanner" class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-lg mb-8 flex items-center gap-3">
                <i class="fa-solid fa-circle-info text-amber-600 text-lg"></i>
                <span id="displayInstructions" class="print-instr text-sm font-medium text-amber-900">Do this homework in the math notebook.</span>
            </div>

            <!-- Questions grid: 2 per row, plain, no card decoration -->
            <div id="questionsGrid" class="grid gap-y-10 gap-x-6 my-8 grid-cols-1 md:grid-cols-2">
                <!-- Dynamically Inserted Questions -->
            </div>

            <!-- Footer (class shown only here) -->
            <div class="mt-12 pt-4 border-t border-slate-300 flex justify-between items-center text-xs text-slate-500 font-medium">
                <span class="print-footer">Math Worksheet</span>
                <span id="footerClassLabel" class="print-footer font-bold">5th B</span>
                <span class="print-footer">5 Questions</span>
            </div>
        </div>

    </div>

    <script>
        (function() {
            // ---- Random helpers ----
            const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

            // Format division answer with explicit remainder
            const formatDivisionAnswer = (quotient, remainder) => {
                if (remainder === 0) return `${quotient}`;
                return `Q:${quotient} R:${remainder}`;
            };

            // ---- The five fixed questions ----
            function generateFiveQuestions() {
                const qs = [];

                // 1) 3-digit × 2-digit
                const a1 = randInt(100, 999);
                const b1 = randInt(10, 99);
                qs.push({ a: a1, b: b1, op: '×', answer: String(a1 * b1) });

                // 2) 3-digit × 3-digit
                const a2 = randInt(100, 999);
                const b2 = randInt(100, 999);
                qs.push({ a: a2, b: b2, op: '×', answer: String(a2 * b2) });

                // 3) 4-digit ÷ (2–9), with remainder
                const b3 = randInt(2, 9);
                const a3 = randInt(1000, 9999);
                const q3 = Math.floor(a3 / b3);
                const r3 = a3 % b3;
                qs.push({ a: a3, b: b3, op: '÷', answer: formatDivisionAnswer(q3, r3) });

                // 4) 5-digit ÷ (10–20), with remainder
                const b4 = randInt(10, 20);
                const a4 = randInt(10000, 99999);
                const q4 = Math.floor(a4 / b4);
                const r4 = a4 % b4;
                qs.push({ a: a4, b: b4, op: '÷', answer: formatDivisionAnswer(q4, r4) });

                // 5) 5-digit ÷ (21–99), with remainder
                const b5 = randInt(21, 99);
                const a5 = randInt(10000, 99999);
                const q5 = Math.floor(a5 / b5);
                const r5 = a5 % b5;
                qs.push({ a: a5, b: b5, op: '÷', answer: formatDivisionAnswer(q5, r5) });

                return qs;
            }

            let currentProblems = [];

            // DOM refs
            const classSelect = document.getElementById('classSelect');
            const showAnswersToggle = document.getElementById('showAnswersToggle');
            const generateBtn = document.getElementById('generateBtn');
            const printBtn = document.getElementById('printBtn');
            const mobilePrintBtn = document.getElementById('mobilePrintBtn');
            const themeToggleBtn = document.getElementById('themeToggleBtn');

            const displayTitle = document.getElementById('displayTitle');
            const questionsGrid = document.getElementById('questionsGrid');
            const footerClassLabel = document.getElementById('footerClassLabel');

            function getFormattedDate() {
                const now = new Date();
                return now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function updateMetadata() {
                const dateStr = getFormattedDate();
                const classStr = classSelect.value;
                
                displayTitle.textContent = 'Worksheet – ' + dateStr;
                footerClassLabel.textContent = classStr;
                document.title = classStr + ' - ' + dateStr;
            }

            function renderQuestions() {
                const showAnswers = showAnswersToggle.checked;
                
                // 2 questions per row
                questionsGrid.className = 'grid gap-y-10 gap-x-6 my-8 grid-cols-1 md:grid-cols-2';

                let html = '';
                currentProblems.forEach((prob, idx) => {
                    // Pure equation without equals sign or blank underline
                    html += `
                        <div class="printable-card py-2">
                            <div class="font-mono text-2xl md:text-3xl print-math font-bold text-slate-900 equation-line">
                                <span class="text-slate-400 mr-1">${idx + 1}.</span>
                                <span>${prob.a}</span>
                                <span class="text-brand-600 mx-1">${prob.op}</span>
                                <span>${prob.b}</span>
                                ${showAnswers ? `<span class="text-emerald-700 ml-2">= ${prob.answer}</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                questionsGrid.innerHTML = html;
            }

            function generateWorksheet() {
                currentProblems = generateFiveQuestions();
                renderQuestions();
                updateMetadata();
            }

            function triggerPrint() {
                window.print();
            }

            function bindEvents() {
                generateBtn.addEventListener('click', generateWorksheet);
                showAnswersToggle.addEventListener('change', renderQuestions);
                printBtn.addEventListener('click', triggerPrint);
                mobilePrintBtn.addEventListener('click', triggerPrint);
                themeToggleBtn.addEventListener('click', () => {
                    document.documentElement.classList.toggle('dark');
                });
                classSelect.addEventListener('change', updateMetadata);
            }

            document.addEventListener('DOMContentLoaded', () => {
                bindEvents();
                generateWorksheet();
            });
        })();
    </script>
</body>
</html>
