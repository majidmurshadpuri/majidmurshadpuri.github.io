<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Same-Denominator Fraction Sum & Difference (1-2 digit)</title>
    <style>
        :root {
            --green: #123c35;
            --green2: #1d5b4e;
            --gold: #e7b95b;
            --cream: #fbf8ef;
            --ink: #172b27;
            --muted: #66736e;
            --red: #a83e37;
            --card-bg: #ffffff;
            --border-light: #e5e5d9;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
        }
        body {
            background: linear-gradient(145deg, #e9f0e9, #f8f4e9);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            padding: 1.2vh 1.2vw;
            overflow-x: hidden;
        }
        .quiz-card {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 8px 25px #172b270d;
            padding: clamp(16px, 3.5vh, 30px) clamp(16px, 4vw, 30px);
            margin: auto;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: clamp(20px, 3.5vh, 32px);
            margin: 0 0 4px 0;
            color: var(--ink);
            border-bottom: 2px solid #e5e5d9;
            padding-bottom: clamp(10px, 1.8vh, 16px);
        }
        .subhead {
            color: var(--muted);
            margin: clamp(8px, 1.5vh, 12px) 0 clamp(14px, 2.5vh, 20px) 0;
            font-size: clamp(13px, 1.6vh, 15px);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-badge {
            background: #edf0e9;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: clamp(12px, 1.4vh, 13px);
            font-weight: 800;
            color: var(--green);
        }
        .question-area {
            background: #ffffff;
            border-radius: 16px;
            padding: clamp(14px, 2.5vh, 24px) clamp(14px, 2.5vw, 20px);
            margin: clamp(8px, 1.5vh, 10px) 0 clamp(10px, 2vh, 16px);
            border: 1px solid var(--border-light);
        }
        .question-text {
            font-size: clamp(20px, 4vh, 32px);
            font-weight: 600;
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: clamp(14px, 2.5vh, 24px);
            text-align: center;
            line-height: 1.4;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(8px, 1.5vh, 14px);
            margin-top: clamp(6px, 1vh, 10px);
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            border-radius: 13px;
            padding: clamp(10px, 2vh, 16px) clamp(12px, 2vw, 18px);
            font-size: clamp(18px, 3vh, 26px);
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            user-select: none;
            text-align: center;
            min-height: 60px;
        }
        .option-btn:hover:not(.disabled) {
            border-color: var(--green2);
            background: #f8fbf7;
        }
        .option-btn.selected {
            border-color: var(--green2);
            background: #edf5ef;
            box-shadow: 0 0 0 3px #1d5b4e25;
        }
        .option-btn.disabled { cursor: default; opacity: 0.75; }
        .btn-group {
            display: flex; flex-wrap: wrap;
            gap: clamp(10px, 1.5vh, 14px);
            justify-content: center;
            margin-top: clamp(12px, 2vh, 20px);
        }
        .btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            color: var(--green);
            font-weight: 800;
            padding: clamp(9px, 1.5vh, 12px) clamp(18px, 2.5vw, 24px);
            border-radius: 12px;
            font-size: clamp(14px, 1.8vh, 15px);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: white;
            box-shadow: 0 10px 18px -8px #1b4e6470;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--green2);
            border-color: var(--green2);
            transform: scale(1.02);
        }
        .btn:hover:not(:disabled):not(.btn-primary) {
            background: #f0f4ed;
            border-color: #8ca99a;
        }
        .btn:disabled {
            opacity: 0.5; cursor: not-allowed;
            transform: none !important;
        }
        .result-area {
            background: #ffffff;
            border-radius: 16px;
            padding: clamp(20px, 4vh, 32px) clamp(16px, 3vw, 24px);
            margin: clamp(12px, 2vh, 16px) 0;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .score-big {
            font-size: clamp(40px, 8vh, 64px);
            font-weight: 900;
            color: var(--green);
            line-height: 1.1;
        }
        .score-big small {
            font-size: clamp(20px, 4vh, 32px);
            font-weight: 400;
            color: var(--muted);
        }
        .score-message {
            font-size: clamp(15px, 2.2vh, 20px);
            font-weight: 500;
            margin: clamp(12px, 2vh, 18px) 0;
            line-height: 1.5;
        }
        .congrats-message {
            font-size: clamp(16px, 2.6vh, 24px);
            font-weight: 700;
            margin: clamp(12px, 2vh, 18px) 0;
            line-height: 1.5;
            color: #216342;
        }
        .hide { display: none !important; }
        
        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; }
            .quiz-card { padding: 14px; }
            h1 { font-size: 20px; }
            .question-text { font-size: 20px; }
            .option-btn { font-size: 18px; padding: 12px 14px; }
            .score-big { font-size: 42px; }
            .result-area { padding: 20px 14px; }
        }
    </style>
</head>
<body>
<div class="quiz-card">
    <h1>Same-Denominator Fractions (1-2 digit)</h1>
    <div class="subhead">
        <div id="statusText">Answer all 5 questions. Score shown at the end.</div>
        <div class="progress-badge" id="progressBadge">0 / 5</div>
    </div>

    <div id="questionView">
        <div class="question-area">
            <div class="question-text" id="questionText"></div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>
        </div>
    </div>

    <div id="resultView" class="hide">
        <div class="result-area">
            <div class="score-big" id="scoreDisplay">0<small>/5</small></div>
            <div class="score-message" id="scoreMessage"></div>
            <div class="congrats-message" id="congratsMessage" style="display: none;"></div>
            <div class="btn-group" id="resultButtons" style="margin-top: 24px;">
                <button class="btn" id="tryAgainBtn">🔄 Try again</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- CONSTANTS ----------
        const STORAGE_KEY = 'same_denom_fraction_1_2digit_quiz_v1';
        const TOTAL_QUESTIONS = 5;

        // ---------- HELPER: GCD ----------
        function gcd(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while (b) {
                const t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        // ---------- GENERATE SINGLE QUESTION ----------
        // Same denominators. Numerators and denominators are distinct.
        // Each number can be 1 or 2 digits (1-99).
        // Each fraction: numerator != denominator (n1 != d, n2 != d).
        // Result must be in simplest form.
        function generateOneQuestion(usedPairs) {
            const MAX_ATTEMPTS = 6000;
            for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                // Choose a shared denominator (1 or 2 digits, 2..99)
                const d = Math.floor(Math.random() * 98) + 2;

                // Choose two distinct numerators from 1..99, neither equal to d, and n1 != n2
                const n1 = Math.floor(Math.random() * 99) + 1;
                if (n1 === d) continue;
                let n2 = Math.floor(Math.random() * 99) + 1;
                if (n2 === d) continue;
                if (n2 === n1) continue;

                // Choose operation; if subtraction, ensure positive result
                const operation = Math.random() < 0.5 ? '+' : '−';

                let rawNum;
                if (operation === '+') {
                    rawNum = n1 + n2;
                } else {
                    rawNum = n1 - n2;
                    if (rawNum <= 0) continue;
                }

                // Reduce
                const g = gcd(rawNum, d);
                const correctNum = rawNum / g;
                const correctDen = d / g;

                // Avoid trivial results (like 1/1) and zero
                if (correctNum === 0) continue;
                if (correctNum === correctDen) continue;

                const pairKey = `${n1}/${d} ${operation} ${n2}/${d}`;
                if (usedPairs.has(pairKey)) continue;

                return {
                    n1, n2, d,
                    operation,
                    correctNum,
                    correctDen,
                    pairKey
                };
            }
            return null;
        }

        // ---------- GENERATE FULL SET ----------
        function generateQuestionSet(N) {
            const usedPairs = new Set();
            const questions = [];
            for (let q = 0; q < N; q++) {
                const question = generateOneQuestion(usedPairs);
                if (!question) return null;
                usedPairs.add(question.pairKey);
                questions.push(question);
            }
            return questions;
        }

        // ---------- BUILD OPTIONS ----------
        function buildOptions(correctQuestion) {
            const correctNum = correctQuestion.correctNum;
            const correctDen = correctQuestion.correctDen;
            const denominator = correctQuestion.d;

            const distractorKeys = new Set();
            distractorKeys.add(correctNum + '/' + correctDen);
            const distractors = [];

            const MAX_ATTEMPTS = 3000;
            let attempts = 0;

            while (distractors.length < 3 && attempts < MAX_ATTEMPTS) {
                attempts++;

                // Strategy 1: Random fraction with 1-2 digit numbers
                if (Math.random() < 0.65) {
                    let candNum = Math.floor(Math.random() * 99) + 1;
                    let candDen;
                    if (Math.random() < 0.55) {
                        // same denominator
                        candDen = denominator;
                    } else {
                        // other 1-2 digit denominator
                        candDen = Math.floor(Math.random() * 98) + 2;
                    }
                    if (candDen === 0) continue;

                    const g = gcd(candNum, candDen);
                    const fn = candNum / g;
                    const fd = candDen / g;

                    const key = fn + '/' + fd;
                    if (distractorKeys.has(key)) continue;
                    if (fn === fd) continue; // avoid trivial 1/1
                    distractorKeys.add(key);
                    distractors.push({ num: fn, den: fd });
                    continue;
                }

                // Strategy 2: Perturb the correct answer
                let candNum = correctNum;
                let candDen = correctDen;
                const roll = Math.random();
                if (roll < 0.5) {
                    candNum = Math.max(1, correctNum + (Math.floor(Math.random() * 7) - 3));
                } else {
                    candDen = Math.max(1, correctDen + (Math.floor(Math.random() * 7) - 3));
                }

                if (candNum === 0 || candDen === 0) continue;
                if (candNum === candDen) continue;

                const g = gcd(candNum, candDen);
                const fn = candNum / g;
                const fd = candDen / g;

                const key = fn + '/' + fd;
                if (distractorKeys.has(key)) continue;
                distractorKeys.add(key);
                distractors.push({ num: fn, den: fd });
            }

            // Fallback
            while (distractors.length < 3) {
                const n = Math.floor(Math.random() * 99) + 1;
                const dd = Math.floor(Math.random() * 98) + 2;
                if (n === dd) continue;
                const g = gcd(n, dd);
                const fn = n / g;
                const fd = dd / g;
                if (fn === fd) continue;
                const key = fn + '/' + fd;
                if (distractorKeys.has(key)) continue;
                distractorKeys.add(key);
                distractors.push({ num: fn, den: fd });
            }

            const options = [{ num: correctNum, den: correctDen }, ...distractors];

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            return options;
        }

        // ---------- STATE ----------
        let state = {
            questions: [],
            currentIndex: 0,
            answers: [],
            optionsList: [],
            completed: false,
            score: 0
        };

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
            catch (e) { /* ignore */ }
        }
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function clearState() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        }

        // ---------- RENDER QUESTION ----------
        function renderCurrentQuestion() {
            if (state.completed) { renderResult(); return; }
            const qIndex = state.currentIndex;
            if (qIndex >= state.questions.length) {
                state.completed = true;
                saveState();
                renderResult();
                return;
            }

            const q = state.questions[qIndex];
            const options = state.optionsList[qIndex];
            const selectedIdx = state.answers[qIndex];

            document.getElementById('progressBadge').textContent = `${qIndex + 1} / ${TOTAL_QUESTIONS}`;

            const qt = document.getElementById('questionText');
            qt.innerHTML = `
                <span style="display:inline-flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;">
                    <span style="display:inline-flex; flex-direction:column; align-items:center; font-size:clamp(24px,5vh,40px); font-weight:800; color:var(--green2); line-height:1.1;">
                        <span style="border-bottom:3px solid var(--green); padding:0 12px 4px 12px;">${q.n1}</span>
                        <span style="padding:4px 12px 0 12px;">${q.d}</span>
                    </span>
                    <span style="font-size:clamp(28px,5vh,44px); font-weight:300; margin:0 6px;">${q.operation}</span>
                    <span style="display:inline-flex; flex-direction:column; align-items:center; font-size:clamp(24px,5vh,40px); font-weight:800; color:var(--green2); line-height:1.1;">
                        <span style="border-bottom:3px solid var(--green); padding:0 12px 4px 12px;">${q.n2}</span>
                        <span style="padding:4px 12px 0 12px;">${q.d}</span>
                    </span>
                    <span style="font-size:clamp(24px,5vh,40px); font-weight:700; margin-left:8px; color:var(--green);">= ?</span>
                </span>
            `;

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (selectedIdx === idx) btn.classList.add('selected');

                btn.innerHTML = `
                    <span style="display:inline-flex; flex-direction:column; align-items:center; line-height:1.1;">
                        <span style="border-bottom:2px solid currentColor; padding:0 8px 2px 8px;">${opt.num}</span>
                        <span style="padding:2px 8px 0 8px;">${opt.den}</span>
                    </span>
                `;

                btn.dataset.optIndex = idx;
                btn.addEventListener('click', () => {
                    if (state.completed) return;
                    state.answers[qIndex] = idx;
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    document.getElementById('submitBtn').disabled = false;
                    saveState();
                });
                grid.appendChild(btn);
            });

            const submitBtn = document.getElementById('submitBtn');
            const hasSelection = state.answers[qIndex] !== null && state.answers[qIndex] !== undefined;
            submitBtn.disabled = !hasSelection;
            submitBtn.textContent = hasSelection ? 'Next question →' : 'Submit answer';

            const newSubmit = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
            newSubmit.id = 'submitBtn';
            newSubmit.addEventListener('click', () => {
                if (state.answers[qIndex] === null || state.answers[qIndex] === undefined) return;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
                if (state.currentIndex < TOTAL_QUESTIONS - 1) {
                    state.currentIndex++;
                    saveState();
                    renderCurrentQuestion();
                } else {
                    finalizeQuiz();
                }
            });

            document.getElementById('questionView').classList.remove('hide');
            document.getElementById('resultView').classList.add('hide');
            document.getElementById('statusText').textContent = `Question ${qIndex + 1} of ${TOTAL_QUESTIONS}`;
        }

        // ---------- FINALIZE ----------
        function finalizeQuiz() {
            let score = 0;
            state.questions.forEach((q, idx) => {
                const ansIdx = state.answers[idx];
                const chosen = state.optionsList[idx][ansIdx];
                if (chosen && chosen.num === q.correctNum && chosen.den === q.correctDen) score++;
            });
            state.score = score;
            state.completed = true;
            saveState();
            renderResult();
        }

        // ---------- RENDER RESULT ----------
        function renderResult() {
            document.getElementById('questionView').classList.add('hide');
            document.getElementById('resultView').classList.remove('hide');

            const score = state.score;
            const total = TOTAL_QUESTIONS;
            document.getElementById('scoreDisplay').innerHTML = `${score}<small>/${total}</small>`;

            const msgEl = document.getElementById('scoreMessage');
            const congratsEl = document.getElementById('congratsMessage');
            const tryAgainBtn = document.getElementById('tryAgainBtn');

            if (score === total) {
                msgEl.style.display = 'none';
                congratsEl.style.display = 'block';
                congratsEl.textContent = '🎉 Perfect score! You got all 5 correct!';
                tryAgainBtn.style.display = 'none';
            } else {
                msgEl.style.display = 'block';
                msgEl.textContent = `You scored ${score}/${total}. Try again to improve.`;
                msgEl.style.color = '#a83e37';
                congratsEl.style.display = 'none';
                tryAgainBtn.style.display = 'inline-flex';
            }

            const newTryBtn = tryAgainBtn.cloneNode(true);
            tryAgainBtn.parentNode.replaceChild(newTryBtn, tryAgainBtn);
            newTryBtn.id = 'tryAgainBtn';
            newTryBtn.addEventListener('click', resetAndStartNewQuiz);

            document.getElementById('statusText').textContent = 'Quiz completed';
            document.getElementById('progressBadge').textContent = `${total} / ${total}`;
        }

        // ---------- START / RESET ----------
        function startNewQuiz() {
            let questions = null;
            let attempts = 0;
            while (attempts < 400 && !questions) {
                questions = generateQuestionSet(TOTAL_QUESTIONS);
                attempts++;
            }
            if (!questions) {
                alert('Could not generate a valid quiz. Please refresh and try again.');
                return;
            }
            const optionsList = questions.map(q => buildOptions(q));

            state = {
                questions,
                currentIndex: 0,
                answers: new Array(TOTAL_QUESTIONS).fill(null),
                optionsList,
                completed: false,
                score: 0
            };
            saveState();
            renderCurrentQuestion();
        }

        function resetAndStartNewQuiz() {
            clearState();
            startNewQuiz();
        }

        // ---------- INIT ----------
        window.addEventListener('DOMContentLoaded', () => {
            const saved = loadState();
            if (saved && saved.questions && saved.questions.length === TOTAL_QUESTIONS) {
                state = saved;
                if (!state.optionsList || state.optionsList.length !== TOTAL_QUESTIONS) {
                    state.optionsList = state.questions.map(q => buildOptions(q));
                }
                if (!state.answers || state.answers.length !== TOTAL_QUESTIONS) {
                    state.answers = new Array(TOTAL_QUESTIONS).fill(null);
                }
                if (state.completed === undefined) state.completed = false;
                if (state.score === undefined) state.score = 0;

                if (state.completed) renderResult();
                else renderCurrentQuestion();
            } else {
                startNewQuiz();
            }

            window.addEventListener('beforeunload', () => {
                if (state && state.questions) saveState();
            });
        });

        window.__quizState = () => state;
        window.__resetQuiz = resetAndStartNewQuiz;
    })();
</script>
</body>
</html>
