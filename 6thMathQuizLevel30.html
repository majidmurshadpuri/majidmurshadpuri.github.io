<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decimal Comparison: Greatest / Smallest</title>
    <style>
        :root {
            --green: #123c35;
            --green2: #1d5b4e;
            --gold: #e7b95b;
            --cream: #fbf8ef;
            --ink: #172b27;
            --muted: #66736e;
            --red: #a83e37;
            --card-bg: #ffffff;
            --border-light: #e5e5d9;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
        }
        body {
            background: linear-gradient(145deg, #e9f0e9, #f8f4e9);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            padding: 1.2vh 1.2vw;
            overflow-x: hidden;
        }
        .quiz-card {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 8px 25px #172b270d;
            padding: clamp(16px, 3.5vh, 30px) clamp(16px, 4vw, 30px);
            margin: auto;
            display: flex;
            flex-direction: column;
        }
        h1 {
            font-size: clamp(20px, 3.5vh, 32px);
            margin: 0 0 4px 0;
            color: var(--ink);
            border-bottom: 2px solid #e5e5d9;
            padding-bottom: clamp(10px, 1.8vh, 16px);
        }
        .subhead {
            color: var(--muted);
            margin: clamp(8px, 1.5vh, 12px) 0 clamp(14px, 2.5vh, 20px) 0;
            font-size: clamp(13px, 1.6vh, 15px);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .progress-badge {
            background: #edf0e9;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: clamp(12px, 1.4vh, 13px);
            font-weight: 800;
            color: var(--green);
        }
        .question-area {
            background: #ffffff;
            border-radius: 16px;
            padding: clamp(14px, 2.5vh, 24px) clamp(14px, 2.5vw, 20px);
            margin: clamp(8px, 1.5vh, 10px) 0 clamp(10px, 2vh, 16px);
            border: 1px solid var(--border-light);
        }
        .question-text {
            font-size: clamp(20px, 4vh, 32px);
            font-weight: 600;
            color: var(--green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: clamp(14px, 2.5vh, 24px);
            text-align: center;
            line-height: 1.4;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(8px, 1.5vh, 14px);
            margin-top: clamp(6px, 1vh, 10px);
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            border-radius: 13px;
            padding: clamp(10px, 2vh, 16px) clamp(12px, 2vw, 18px);
            font-size: clamp(18px, 3vh, 26px);
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            user-select: none;
            text-align: center;
            min-height: 60px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .option-btn:hover:not(.disabled) {
            border-color: var(--green2);
            background: #f8fbf7;
        }
        .option-btn.selected {
            border-color: var(--green2);
            background: #edf5ef;
            box-shadow: 0 0 0 3px #1d5b4e25;
        }
        .option-btn.disabled { cursor: default; opacity: 0.75; }
        .btn-group {
            display: flex; flex-wrap: wrap;
            gap: clamp(10px, 1.5vh, 14px);
            justify-content: center;
            margin-top: clamp(12px, 2vh, 20px);
        }
        .btn {
            background: #ffffff;
            border: 2px solid #e6e9e1;
            color: var(--green);
            font-weight: 800;
            padding: clamp(9px, 1.5vh, 12px) clamp(18px, 2.5vw, 24px);
            border-radius: 12px;
            font-size: clamp(14px, 1.8vh, 15px);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--green);
            border-color: var(--green);
            color: white;
            box-shadow: 0 10px 18px -8px #1b4e6470;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--green2);
            border-color: var(--green2);
            transform: scale(1.02);
        }
        .btn:hover:not(:disabled):not(.btn-primary) {
            background: #f0f4ed;
            border-color: #8ca99a;
        }
        .btn:disabled {
            opacity: 0.5; cursor: not-allowed;
            transform: none !important;
        }
        .result-area {
            background: #ffffff;
            border-radius: 16px;
            padding: clamp(20px, 4vh, 32px) clamp(16px, 3vw, 24px);
            margin: clamp(12px, 2vh, 16px) 0;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .score-big {
            font-size: clamp(40px, 8vh, 64px);
            font-weight: 900;
            color: var(--green);
            line-height: 1.1;
        }
        .score-big small {
            font-size: clamp(20px, 4vh, 32px);
            font-weight: 400;
            color: var(--muted);
        }
        .score-message {
            font-size: clamp(15px, 2.2vh, 20px);
            font-weight: 500;
            margin: clamp(12px, 2vh, 18px) 0;
            line-height: 1.5;
        }
        .congrats-message {
            font-size: clamp(16px, 2.6vh, 24px);
            font-weight: 700;
            margin: clamp(12px, 2vh, 18px) 0;
            line-height: 1.5;
            color: #216342;
        }
        .hide { display: none !important; }

        .direction-badge {
            display: inline-block;
            background: var(--gold);
            color: #3d2f10;
            font-weight: 900;
            font-size: clamp(12px, 1.8vh, 15px);
            padding: 5px 18px;
            border-radius: 30px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .question-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(10px, 2vw, 16px);
            margin-top: 8px;
        }
        .number-chip {
            background: #f2f7f1;
            border: 2px solid #d3e0d5;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: clamp(18px, 3.2vh, 28px);
            font-weight: 800;
            color: var(--green2);
            font-family: 'Courier New', monospace;
            letter-spacing: 1.5px;
            word-break: break-all;
        }

        @media (max-width: 650px) {
            .options-grid { grid-template-columns: 1fr; }
            .quiz-card { padding: 14px; }
            h1 { font-size: 20px; }
            .question-text { font-size: 20px; }
            .option-btn { font-size: 16px; padding: 12px 14px; }
            .score-big { font-size: 42px; }
            .result-area { padding: 20px 14px; }
            .number-chip { font-size: 16px; padding: 8px 12px; }
        }
    </style>
</head>
<body>
<div class="quiz-card">
    <h1>Greatest / Smallest Decimal</h1>
    <div class="subhead">
        <div id="statusText">Answer all 5 questions. Score shown at the end.</div>
        <div class="progress-badge" id="progressBadge">0 / 5</div>
    </div>

    <div id="questionView">
        <div class="question-area">
            <div style="text-align:center;">
                <span class="direction-badge" id="directionBadge">Greatest</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" id="submitBtn" disabled>Submit answer</button>
        </div>
    </div>

    <div id="resultView" class="hide">
        <div class="result-area">
            <div class="score-big" id="scoreDisplay">0<small>/5</small></div>
            <div class="score-message" id="scoreMessage"></div>
            <div class="congrats-message" id="congratsMessage" style="display: none;"></div>
            <div class="btn-group" id="resultButtons" style="margin-top: 24px;">
                <button class="btn" id="tryAgainBtn">🔄 Try again</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // =====================================================================
        // HAND-CRAFTED 5-QUESTION QUIZ — each question targets a specific
        // misconception, progresses in difficulty (Level 1 → Level 5), and
        // satisfies all mandatory constraints:
        //   * Same integer-part digit count within each question
        //   * Varying fractional-part lengths
        //   * Exactly one correct answer
        //   * No two options equal in value (no 7.5 vs 7.500 traps)
        // =====================================================================

        // Helper: compare two decimal string values precisely (as BigInt-scaled)
        // Returns -1, 0, 1
        function compareDecimalStrings(a, b) {
            // Split into int and frac parts
            const [ai, af = ''] = String(a).split('.');
            const [bi, bf = ''] = String(b).split('.');
            // Integer parts must have equal length for our quiz, but let's be general.
            // Pad to equal length
            const intLen = Math.max(ai.length, bi.length);
            const Aint = ai.padStart(intLen, '0');
            const Bint = bi.padStart(intLen, '0');
            if (Aint < Bint) return -1;
            if (Aint > Bint) return 1;
            // Fractional: pad to equal length
            const fracLen = Math.max(af.length, bf.length);
            const Af = af.padEnd(fracLen, '0');
            const Bf = bf.padEnd(fracLen, '0');
            if (Af < Bf) return -1;
            if (Af > Bf) return 1;
            return 0;
        }

        // =====================================================================
        // FIVE HAND-CRAFTED QUESTIONS
        // =====================================================================

        // Question 1 — Level 1: Basic Misconception Detection
        // Integer parts: all 1 digit. Fractional lengths: 1, 2, 3, 4 (varies).
        // Misconception: "Longer decimal part = bigger number".
        // Numbers: 8.9, 8.87, 8.879, 8.8789
        // True order: 8.8789 < 8.879 < 8.87 < 8.9
        // SELECT THE GREATEST → 8.9 (option B in the layout below)
        const Q1 = {
            level: 1,
            direction: 'greatest',
            options: [
                { str: '8.87',   val: 8.87   },
                { str: '8.9',    val: 8.9    },
                { str: '8.8789', val: 8.8789 },
                { str: '8.879',  val: 8.879  }
            ],
            correct: '8.9'
        };

        // Question 2 — Level 2: Zero Traps
        // Integer parts: all 1 digit. Fractional lengths: 1, 3, 4, 5.
        // Misconception: leading/trailing zeros change value; more decimal places mean bigger.
        // Numbers: 6.5, 6.05, 6.005, 6.0005
        // True order: 6.0005 < 6.005 < 6.05 < 6.5
        // SELECT THE SMALLEST → 6.0005 (option D)
        const Q2 = {
            level: 2,
            direction: 'smallest',
            options: [
                { str: '6.5',    val: 6.5    },
                { str: '6.05',   val: 6.05   },
                { str: '6.005',  val: 6.005  },
                { str: '6.0005', val: 6.0005 }
            ],
            correct: '6.0005'
        };

        // Question 3 — Level 3: Digit Repetition Traps
        // Integer parts: all 1 digit. Fractional lengths: 3, 4, 5, 6.
        // Misconception: repeated 9s indicate larger; longer repetition means bigger.
        // Numbers: 4.099, 4.0989, 4.0999, 4.09999
        // True order: 4.0989 < 4.099 < 4.0999 < 4.09999
        // SELECT THE GREATEST → 4.09999 (option A)
        const Q3 = {
            level: 3,
            direction: 'greatest',
            options: [
                { str: '4.09999', val: 4.09999 },
                { str: '4.0999',  val: 4.0999  },
                { str: '4.099',   val: 4.099   },
                { str: '4.0989',  val: 4.0989  }
            ],
            correct: '4.09999'
        };

        // Question 4 — Level 4: Length Illusions
        // Integer parts: all 2 digits. Fractional lengths: 1, 3, 5, 7.
        // Misconception: the longest-looking number is the greatest.
        // Numbers: 12.7, 12.699, 12.69999, 12.7000001
        // True order: 12.699 < 12.69999 < 12.7 < 12.7000001
        // SELECT THE SMALLEST → 12.699 (option C)
        const Q4 = {
            level: 4,
            direction: 'smallest',
            options: [
                { str: '12.7000001', val: 12.7000001 },
                { str: '12.7',       val: 12.7       },
                { str: '12.699',     val: 12.699     },
                { str: '12.69999',   val: 12.69999   }
            ],
            correct: '12.699'
        };

        // Question 5 — Level 5: Advanced Decimal Traps
        // Integer parts: all 2 digits. Fractional lengths: 7, 8, 9, 10.
        // Misconception: the number with the most digits after decimal is biggest.
        // Uses the progressive digit-revelation technique from the prompt.
        // Numbers: 23.7777777, 23.77777778, 23.777777777, 23.7777777778
        // True order: 23.7777777 < 23.777777777 < 23.7777777778 < 23.77777778
        // SELECT THE GREATEST → 23.77777778 (option B)
        const Q5 = {
            level: 5,
            direction: 'greatest',
            options: [
                { str: '23.7777777',    val: 23.7777777    },
                { str: '23.77777778',   val: 23.77777778   },
                { str: '23.777777777',  val: 23.777777777  },
                { str: '23.7777777778', val: 23.7777777778 }
            ],
            correct: '23.77777778'
        };

        // =====================================================================
        // VALIDATION & STATE
        // =====================================================================
        const QUIZ = [Q1, Q2, Q3, Q4, Q5];
        const TOTAL_QUESTIONS = 5;
        const STORAGE_KEY = 'decimal_greatest_smallest_misconception_quiz_v1';

        // Validate each question
        QUIZ.forEach((q, i) => {
            // Check 1: exactly one correct
            const matches = q.options.filter(o => o.str === q.correct);
            if (matches.length !== 1) {
                console.error(`Q${i + 1}: expected exactly one correct, found ${matches.length}`);
            }
            // Check 2: all integer parts same length
            const intLens = q.options.map(o => o.str.split('.')[0].length);
            if (new Set(intLens).size !== 1) {
                console.error(`Q${i + 1}: integer parts have different lengths:`, intLens);
            }
            // Check 3: fractional parts vary in length
            const fracLens = q.options.map(o => o.str.split('.')[1].length);
            if (new Set(fracLens).size < 2) {
                console.error(`Q${i + 1}: fractional lengths do not vary:`, fracLens);
            }
            // Check 4: no two options are numerically equal
            for (let a = 0; a < q.options.length; a++) {
                for (let b = a + 1; b < q.options.length; b++) {
                    if (compareDecimalStrings(q.options[a].str, q.options[b].str) === 0) {
                        console.error(`Q${i + 1}: options ${q.options[a].str} and ${q.options[b].str} are equal`);
                    }
                }
            }
            // Check 5: correct answer actually is the greatest/smallest
            const cmp = (a, b) => compareDecimalStrings(a.str, b.str);
            const sorted = [...q.options].sort(cmp);
            const expected = q.direction === 'greatest' ? sorted[3] : sorted[0];
            if (expected.str !== q.correct) {
                console.error(`Q${i + 1}: correct answer is ${q.correct}, but ${q.direction} should be ${expected.str}`);
            }
        });

        // =====================================================================
        // QUIZ ENGINE
        // =====================================================================
        let state = {
            currentIndex: 0,
            answers: new Array(TOTAL_QUESTIONS).fill(null),
            completed: false,
            score: 0
        };

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
            catch (e) { /* ignore */ }
        }
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) { return null; }
        }
        function clearState() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        }

        function renderCurrentQuestion() {
            if (state.completed) { renderResult(); return; }
            const qIndex = state.currentIndex;
            if (qIndex >= TOTAL_QUESTIONS) {
                state.completed = true;
                saveState();
                renderResult();
                return;
            }

            const q = QUIZ[qIndex];
            const selectedIdx = state.answers[qIndex];

            document.getElementById('progressBadge').textContent = `${qIndex + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById('statusText').textContent = `Question ${qIndex + 1} of ${TOTAL_QUESTIONS} (Level ${q.level})`;

            const dirBadge = document.getElementById('directionBadge');
            dirBadge.textContent = q.direction === 'greatest' ? '⬆ Select the Greatest' : '⬇ Select the Smallest';

            // Build the question text area
            const qt = document.getElementById('questionText');
            let listHTML = '<div class="question-list">';
            q.options.forEach((opt) => {
                listHTML += `<span class="number-chip">${opt.str}</span>`;
            });
            listHTML += '</div>';
            qt.innerHTML = listHTML +
                `<div style="font-size:clamp(14px,2.1vh,18px); margin-top:14px; color:var(--muted); font-weight:700;">
                    Which one is the ${q.direction} number?
                </div>`;

            // Build the option buttons (shuffled order already encoded in QUIZ array)
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('div');
                btn.className = 'option-btn';
                if (selectedIdx === idx) btn.classList.add('selected');
                btn.textContent = opt.str;

                btn.addEventListener('click', () => {
                    if (state.completed) return;
                    state.answers[qIndex] = idx;
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    document.getElementById('submitBtn').disabled = false;
                    saveState();
                });
                grid.appendChild(btn);
            });

            const submitBtn = document.getElementById('submitBtn');
            const hasSelection = state.answers[qIndex] !== null && state.answers[qIndex] !== undefined;
            submitBtn.disabled = !hasSelection;
            submitBtn.textContent = hasSelection ? (qIndex === TOTAL_QUESTIONS - 1 ? 'Finish quiz →' : 'Next question →') : 'Submit answer';

            // Replace submit to avoid stale listeners
            const newSubmit = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newSubmit, submitBtn);
            newSubmit.id = 'submitBtn';
            newSubmit.addEventListener('click', () => {
                if (state.answers[qIndex] === null || state.answers[qIndex] === undefined) return;
                document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
                if (state.currentIndex < TOTAL_QUESTIONS - 1) {
                    state.currentIndex++;
                    saveState();
                    renderCurrentQuestion();
                } else {
                    finalizeQuiz();
                }
            });

            document.getElementById('questionView').classList.remove('hide');
            document.getElementById('resultView').classList.add('hide');
        }

        function finalizeQuiz() {
            let score = 0;
            QUIZ.forEach((q, idx) => {
                const ansIdx = state.answers[idx];
                if (ansIdx === null || ansIdx === undefined) return;
                if (q.options[ansIdx].str === q.correct) score++;
            });
            state.score = score;
            state.completed = true;
            saveState();
            renderResult();
        }

        function renderResult() {
            document.getElementById('questionView').classList.add('hide');
            document.getElementById('resultView').classList.remove('hide');

            const score = state.score;
            document.getElementById('scoreDisplay').innerHTML = `${score}<small>/${TOTAL_QUESTIONS}</small>`;

            const msgEl = document.getElementById('scoreMessage');
            const congratsEl = document.getElementById('congratsMessage');
            const tryAgainBtn = document.getElementById('tryAgainBtn');

            if (score === TOTAL_QUESTIONS) {
                msgEl.style.display = 'none';
                congratsEl.style.display = 'block';
                congratsEl.textContent = '🎉 Perfect score! You have mastered decimal place value!';
                tryAgainBtn.style.display = 'none';
            } else {
                msgEl.style.display = 'block';
                msgEl.textContent = `You scored ${score}/${TOTAL_QUESTIONS}. Remember: compare place values, not digit counts!`;
                msgEl.style.color = '#a83e37';
                congratsEl.style.display = 'none';
                tryAgainBtn.style.display = 'inline-flex';
            }

            const newTryBtn = tryAgainBtn.cloneNode(true);
            tryAgainBtn.parentNode.replaceChild(newTryBtn, tryAgainBtn);
            newTryBtn.id = 'tryAgainBtn';
            newTryBtn.addEventListener('click', resetAndStartNewQuiz);

            document.getElementById('statusText').textContent = 'Quiz completed';
            document.getElementById('progressBadge').textContent = `${TOTAL_QUESTIONS} / ${TOTAL_QUESTIONS}`;
        }

        function startNewQuiz() {
            state = {
                currentIndex: 0,
                answers: new Array(TOTAL_QUESTIONS).fill(null),
                completed: false,
                score: 0
            };
            saveState();
            renderCurrentQuestion();
        }

        function resetAndStartNewQuiz() {
            clearState();
            startNewQuiz();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = loadState();
            if (saved && saved.answers && saved.answers.length === TOTAL_QUESTIONS) {
                state = saved;
                if (state.completed === undefined) state.completed = false;
                if (state.score === undefined) state.score = 0;
                if (state.completed) renderResult();
                else renderCurrentQuestion();
            } else {
                startNewQuiz();
            }

            window.addEventListener('beforeunload', () => {
                saveState();
            });
        });

        window.__quizState = () => state;
        window.__resetQuiz = resetAndStartNewQuiz;
    })();
</script>
</body>
</html>
